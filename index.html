<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SAYEH SPORT PLUS</title>
<style>
/* SAYEH SPORT PLUS — mobile-first styles. Logical properties so RTL/LTR both work. */
:root {
  --bg: #0b0b0c;
  --surface: #151617;
  --surface-2: #1e1f21;
  --line: #2a2b2d;
  --text: #f5f6f4;
  --muted: #9a9c99;
  --accent: #c6f432;
  --accent-ink: #11160a;
  --good: #3ecf8e;
  --bad: #ff6b6b;
  --neutral: #8ea0b8;
  --radius: 18px;
  --radius-sm: 12px;
  --tap: 48px;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font-head: "Roboto Condensed", "Arial Narrow", "Oswald", system-ui, "Noto Sans Arabic", sans-serif;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Naskh Arabic", Tahoma, sans-serif;
}

/* ---- Themes: dark (default) and light ---- */
:root { color-scheme: dark; }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f5f2; --surface: #ffffff; --surface-2: #eceee8; --line: #dcdfd6;
  --text: #16181a; --muted: #6a6e66; --accent: #4f7a0a; --accent-ink: #ffffff;
  --good: #1a9e63; --bad: #d64545; --neutral: #5f7189;
}
:root[data-theme="light"] .coach, :root[data-theme="light"] .coach-banner { background: linear-gradient(140deg, #ffffff 0%, #eef1e6 70%); }
:root[data-theme="light"] .hb-sum { background: linear-gradient(135deg, #e6f0cc, #f7faee 70%); }
:root[data-theme="light"] .ring .trk, :root[data-theme="light"] .rg .trk { stroke: #dcdfd6; }
:root[data-theme="light"] .cal-d.s-rest, :root[data-theme="light"] .lgd.s-rest { background: #e3e5de; color: var(--muted); }
:root[data-theme="light"] .cal-d.s-missed, :root[data-theme="light"] .lgd.s-missed { background: #f8d9d9; }
:root[data-theme="light"] .mini-fill { background: #c3c7bb; }
:root[data-theme="light"] .mini-fill.ok { background: var(--good); }
:root[data-theme="light"] .bag-hero::before { background: linear-gradient(180deg, rgba(244,245,242,.82) 0%, rgba(244,245,242,.9) 45%, rgba(244,245,242,.96) 100%); }
:root[data-theme="light"] .btn.primary { box-shadow: 0 6px 18px rgba(79,122,10,.2); }
:root[data-theme="light"] .logo-box img, :root[data-theme="light"] .logo-full { filter: drop-shadow(0 2px 6px rgba(0,0,0,.25)); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.5; }
body { min-height: 100vh; overscroll-behavior-y: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 1.6rem; line-height: 1.25; }
h2 { font-size: 1.2rem; margin-block-end: 8px; }
h3 { font-size: 1rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }

/* Layout */
#app { min-height: 100vh; }
.shell { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); border-block-end: 1px solid var(--line);
}
.topbar .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.topbar .brand b { font-size: .95rem; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo-box { width: 40px; height: 40px; border-radius: 10px; background: transparent; display: grid; place-items: center; overflow: hidden; border: 0; flex: none; }
.logo-box img { width: 100%; height: 100%; object-fit: contain; }
.logo-box span { font-weight: 800; font-size: .85rem; }
.icon-btn { color: var(--text); width: var(--tap); height: var(--tap); border-radius: 50%; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 1.2rem; }
main.view { flex: 1; padding: 16px 16px calc(var(--nav-h) + var(--safe-b) + 84px); max-width: 640px; width: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Bottom nav */
.nav {
  position: fixed; inset-inline: 0; bottom: 60px; z-index: 30; height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b); display: flex; background: var(--surface); border-block-start: 1px solid var(--line);
}
.nav a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .68rem; min-width: 0; padding-inline: 2px; }
.nav a .ico { font-size: 1.25rem; line-height: 1; }
.nav a span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav a[aria-current="page"] { color: var(--accent); font-weight: 700; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card.tap { cursor: pointer; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-block-end: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.big { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); font-size: .78rem; color: var(--muted); }

/* Coach */
.coach { display: flex; gap: 12px; align-items: flex-start; }
.hello h1 { font-family: var(--font-head); font-size: 1.7rem; font-weight: 800; }
.hello .say { font-size: 1.05rem; margin-block-start: 8px; }
.bubble { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; flex: 1; position: relative; }
.bubble .ref { display: block; margin-block-start: 6px; font-size: .78rem; color: var(--muted); }

/* Progress */
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); width: 0; transition: width .4s ease; }
.bar.good > i { background: var(--good); }

/* Buttons & forms */
.btn { min-height: var(--tap); padding: 0 18px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:active { transform: scale(.98); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

label.field { display: flex; flex-direction: column; gap: 6px; font-size: .88rem; color: var(--muted); }
input[type=text], input[type=number], input[type=time], input[type=date], select, textarea {
  min-height: var(--tap); width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface-2); padding: 0 12px; color: var(--text);
}
textarea { padding: 10px 12px; min-height: 90px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; display: inline-flex; align-items: center; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--tap); }
.switch-row input { width: 24px; height: 24px; accent-color: var(--accent); }

/* Onboarding */
.onb { min-height: 100vh; display: flex; flex-direction: column; padding: 20px 16px 28px; max-width: 560px; margin-inline: auto; gap: 16px; }
.onb-logo { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-block: 10px; }
.onb-logo .logo-box { width: 96px; height: 96px; border-radius: 24px; }
.onb-logo .logo-box span { font-size: 1.8rem; }
.onb-logo .app-name { font-weight: 800; letter-spacing: .08em; }
.dots { display: flex; justify-content: center; gap: 6px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 8px; }
.onb-actions { margin-block-start: auto; display: flex; gap: 10px; }
.onb-actions .btn { flex: 1; }

/* Modal / toast */
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.modal { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + var(--safe-b)); max-height: 88vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.toast { position: fixed; z-index: 60; inset-inline: 16px; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); max-width: 520px; margin-inline: auto; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; text-align: center; }

/* Misc */
.empty { text-align: center; color: var(--muted); padding: 18px 8px; }
.notice { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius: var(--radius-sm); padding: 10px 12px; font-size: .88rem; }
.status-todo { color: var(--muted); }
.divider { height: 1px; background: var(--line); margin-block: 4px; }

[dir="rtl"] .flip-rtl { transform: scaleX(-1); }

/* Workout screen */
.wk { min-height: 100vh; display: flex; flex-direction: column; max-width: 640px; margin-inline: auto; }
.wk-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg); border-block-end: 1px solid var(--line); }
.wk-dots { display: flex; gap: 6px; justify-content: center; padding: 10px 16px 0; flex-wrap: wrap; }
.wk-dots button { width: 26px; height: 8px; border-radius: 6px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.wk-dots button.ok { background: var(--good); }
.wk-dots button.on { background: var(--accent); width: 36px; }
.wk-main { flex: 1; padding: 14px 16px 200px; display: flex; flex-direction: column; gap: 12px; }
.setrow { display: grid; grid-template-columns: 34px 1fr 1fr 64px; gap: 8px; align-items: center; }
.setrow.head { color: var(--muted); font-size: .8rem; text-align: center; }
.setrow .n { text-align: center; font-weight: 700; color: var(--muted); }
.setrow input { text-align: center; font-size: 1.15rem; font-weight: 700; min-height: 54px; }
.setrow .tick { min-height: 54px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface-2); font-size: 1.5rem; cursor: pointer; }
.setrow.done .tick { background: var(--good); color: #052014; border-color: transparent; }
.setrow.done input { opacity: .75; }
.restbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 40; background: var(--surface); border-block-start: 2px solid var(--accent); padding: 12px 16px calc(12px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin-inline: auto; }
.restbar b { font-size: 1.6rem; min-width: 84px; }

/* Charts / progress */
.seg { display: flex; gap: 6px; overflow-x: auto; padding-block-end: 2px; }
.seg .chip { flex: none; }
.chart { width: 100%; height: auto; direction: ltr; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; margin-inline-end: 6px; vertical-align: -1px; }
.delta { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.delta.good { color: var(--good); } .delta.bad { color: var(--bad); } .delta.neutral { color: var(--neutral); }
table.hist { width: 100%; border-collapse: collapse; font-size: .85rem; }
table.hist th, table.hist td { text-align: start; padding: 8px 6px; border-block-end: 1px solid var(--line); vertical-align: top; }
table.hist th { color: var(--muted); font-weight: 600; }
.tablewrap { overflow-x: auto; }

.logo-full { display: block; width: min(260px, 70vw); height: auto; margin-inline: auto; filter: drop-shadow(0 6px 18px rgba(120,170,255,.18)); }

/* ---- The coach: one fixed character, changes pose (tap him) ---- */
.coach, .coach-banner { background: linear-gradient(140deg, #17191a 0%, #0b0b0c 70%); border-color: var(--line); }
.coach-banner { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px 0; margin: 12px 16px 0; overflow: hidden; }
.coach-banner .bubble { padding-block-end: 8px; }
.coach .bubble { flex: 1; min-width: 0; align-self: center; }
.coach-fig { position: relative; display: inline-block; flex: none; cursor: pointer; user-select: none; touch-action: manipulation; outline: none; align-self: flex-end; }
.coach-fig.sm img { height: 118px; } .coach-fig.md img { height: 190px; } .coach-fig.lg img { height: 250px; }
.coach-fig img { aspect-ratio: auto 1 / 2.1; width: auto; max-width: 62vw; display: block; transform-origin: 50% 100%; animation: coach-breathe 4.2s ease-in-out infinite; pointer-events: none; }
.coach-fig:focus-visible { box-shadow: 0 0 0 2px var(--accent); border-radius: 12px; }
.coach-fig.hop img { animation: coach-hop .55s cubic-bezier(.3,1.6,.5,1) 1, coach-breathe 4.2s ease-in-out .55s infinite; }
.say { color: var(--accent); font-weight: 600; margin-block-start: 6px; min-height: 1.3em; }
.coach-big { margin-inline: auto; }
@keyframes coach-breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.02); } }
@keyframes coach-hop { 0% { transform: scale(1.05,.94); } 40% { transform: translateY(-14px) scale(.98,1.04); } 75% { transform: translateY(0) scale(1.03,.96); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .coach-fig img, .coach-fig.hop img { animation: none !important; } }

/* ---- habits / calendar / nutrition / plan ---- */
.mini-cols { display: flex; gap: 8px; align-items: flex-end; height: 110px; margin-block-start: 10px; }
.mini-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; font-size: .72rem; color: var(--muted); }
.mini-fill { width: 100%; min-height: 3px; border-radius: 6px 6px 2px 2px; background: #4a4d46; }
.mini-fill.ok { background: var(--good); }
.mini-col { position: relative; } .mini-col .mini-fill { flex: none; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-block: 10px; }
.cal-h { text-align: center; color: var(--muted); font-size: .75rem; }
.cal-d { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font-size: .85rem; padding: 0; cursor: pointer; }
.cal-d.today { outline: 2px solid var(--accent); }
.cal-d.s-done, .lgd.s-done { background: var(--good); color: #06150e; border-color: transparent; }
.cal-d.s-missed, .cal-d.s-autoMissed, .lgd.s-missed { background: #5a2a2a; border-color: var(--bad); }
.cal-d.s-autoMissed { background: transparent; border-style: dashed; }
.cal-d.s-rest, .lgd.s-rest { background: #2a2b2d; color: var(--muted); }
.cal-d.s-planned, .lgd.s-planned { background: transparent; border-color: var(--accent); }
.lgd { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: middle; margin-inline: 8px 4px; border: 1px solid var(--line); }
.macro-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: .8rem; }
.macro-row b { display: block; font-size: 1rem; }
.food-item { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-block-end: 1px solid var(--line); cursor: pointer; }
.food-item:last-child { border: 0; }
.timeline { position: relative; }
.slot { border-inline-start: 3px solid var(--accent); padding: 6px 10px; margin-block: 6px; background: var(--surface-2); border-radius: 8px; }
.slot.free { border-color: var(--good); background: transparent; border-style: dashed; border-inline-start-style: solid; }
.slot.busy { border-color: #6b6e68; opacity: .8; }
.slot.prayer { border-color: #8aa6d8; }
.slot.conflict { border-color: var(--bad); }
.prayer-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-block-end: 1px solid var(--line); }
.prayer-row.next { color: var(--accent); font-weight: 700; }
.bag-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-block-end: 1px solid var(--line); }
.bag-item input[type=checkbox] { width: 24px; height: 24px; }
.bag-item.checked span.grow { text-decoration: line-through; color: var(--muted); }
.bag-item img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }

/* ---- Theme: black + neon lime, bold condensed headings, pill buttons ---- */
h1, h2, .hero-title, .big { font-family: var(--font-head); }
h1, h2 { font-weight: 800; letter-spacing: .01em; }
.hero-title { font-weight: 800; font-size: 1.9rem; line-height: 1.05; text-transform: uppercase; margin-block: 4px 12px; }
.hero-title b { color: var(--accent); display: block; }
.btn { border-radius: 999px; }
.btn.primary { font-weight: 800; box-shadow: 0 6px 18px rgba(198,244,50,.18); }
.card { border-radius: 20px; }
.nav button[aria-current="page"], .nav .on, .nav a[aria-current="page"] { color: var(--accent); }
.bar > i { background: var(--accent); }
.bar.good > i { background: var(--good); }
.ring-card { display: flex; gap: 16px; align-items: center; }
.ring { position: relative; width: 112px; height: 112px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: #2a2b2d; } .ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-weight: 800; font-size: 1.4rem; line-height: 1.1; }
.ring .mid small { display: block; font-size: .68rem; font-weight: 500; color: var(--muted); }
.ring-stats { flex: 1; display: grid; gap: 8px; }
.ring-stats div { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font-size: .85rem; }
.ring-stats b { margin-inline-start: auto; }
.qa-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qa-grid .qa { padding: 12px 2px; font-size: .74rem; }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 6px; text-align: center; color: var(--text); cursor: pointer; display: grid; gap: 6px; place-items: center; font-size: .82rem; font-weight: 600; }
.qa i { font-style: normal; font-size: 1.4rem; color: var(--accent); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-block: 16px 8px; }
.sec-h h3 { font-family: var(--font-head); font-size: 1.1rem; font-weight: 800; }
.cal-d { background: var(--surface-2); border: 0; border-radius: 12px; position: relative; font-weight: 600; }
.cal-d.today, .cal-d.sel { background: var(--accent); color: var(--accent-ink); outline: 0; font-weight: 800; }
.cal-d.has::after { content: ""; position: absolute; inset-inline: 0; bottom: 4px; margin-inline: auto; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.cal-d.today.has::after, .cal-d.sel.has::after { background: var(--accent-ink); }
.pills { display: flex; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; margin-block: 10px; }
.pills button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 8px 4px; border-radius: 999px; font-weight: 700; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.slot { background: var(--surface-2); border-radius: 16px; border-inline-start: 4px solid var(--accent); padding: 12px; margin-block: 8px; }
.slot.free { background: transparent; border: 1px dashed var(--line); border-inline-start: 4px solid var(--good); }
.slot.prayer { border-inline-start-color: #8aa6d8; } .slot.busy { border-inline-start-color: #6b6e68; } .slot.conflict { border-inline-start-color: var(--bad); }

.bag-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,11,12,.30) 0%, rgba(11,11,12,.62) 45%, rgba(11,11,12,.88) 100%); }
.bag-hero > * { position: relative; }
.bag-hero .bag-item { border-color: rgba(255,255,255,.12); }

/* Coach card: keep the figure compact so the speech bubble gets readable width */
.coach-fig { max-width: 40%; }
.coach-fig.lg img { height: 190px; max-width: 100%; object-fit: contain; }
.coach-fig.md img { max-width: 100%; object-fit: contain; }
.coach-fig.sm img { max-width: 100%; object-fit: contain; }
.coach .bubble { flex: 1 1 55%; min-width: 0; overflow-wrap: anywhere; }

/* Round progress rings (home: calories, macros, level) */
.rg { position: relative; width: var(--s, 84px); height: var(--s, 84px); flex: none; }
.rg svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rg .trk { stroke: #2a2b2d; } .rg .val { stroke: var(--c, var(--accent)); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.rg .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-weight: 800; line-height: 1.1; font-size: 1rem; }
.rg .mid small { display: block; font-size: .62rem; font-weight: 500; color: var(--muted); }
.rg.xl .mid { font-size: 1.6rem; }
.rgs { display: flex; gap: 10px; justify-content: space-around; flex-wrap: wrap; margin-block-start: 12px; }
.rgi { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); text-align: center; }
.dsum h4 { margin: 10px 0 4px; font-size: .95rem; }
.dsum .it { display: flex; gap: 8px; justify-content: space-between; font-size: .85rem; padding: 3px 0; }

/* Nutrition screen */
.nu-head { display: flex; flex-direction: column; gap: 2px; }
.nu-head small { color: var(--muted); font-size: .85rem; }
.nu-head h1 { font-family: var(--font-head); font-size: 2rem; font-weight: 800; }
.wk-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.wk-strip::-webkit-scrollbar { display: none; }
.wk-day { flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-size: .75rem; font-weight: 600; cursor: pointer; padding: 0; }
.wk-day b { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; background: var(--surface-2); color: var(--text); font-size: 1.05rem; }
.wk-day.sel b { background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.wk-day.sel::after { content: ""; width: 18px; height: 3px; border-radius: 3px; background: var(--accent); margin-block-start: -2px; }
.wk-day.fut { opacity: .45; }
.wk-day.today { color: var(--accent); }
.cal-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cal-card .lbl { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.cal-card .num { font-family: var(--font-head); font-size: 3.2rem; font-weight: 800; line-height: 1; margin-block: 4px; }
.gauge { position: relative; width: 132px; height: 132px; flex: none; }
.gauge svg { width: 100%; height: 100%; }
.gauge .trk { stroke: var(--surface-2); } .gauge .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.gauge.over .val { stroke: #f5a524; }
.gauge .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-head); font-weight: 800; font-size: 1.7rem; line-height: 1; padding-block-end: 6px; }
.gauge .mid small { display: block; font-family: var(--font); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-block-start: 4px; }
.mac3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mac { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mac .lbl { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.mac .v { font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; line-height: 1; }
.mac .v span { font-size: .8rem; color: var(--muted); font-weight: 500; }
.mac .bar { height: 6px; } .mac .bar > i { background: var(--mc); }
.mac .left { font-size: .72rem; color: var(--muted); }
.fd { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-block-end: 1px solid var(--line); }
.fd:last-child { border: 0; }
.fd .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 1.4rem; flex: none; }
.fd .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fd .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-block-start: 4px; }
.fd .tags span { background: var(--surface-2); border-radius: 999px; padding: 1px 7px; font-size: .64rem; color: var(--muted); white-space: nowrap; }
.fd .kc { text-align: end; flex: none; } .fd .kc b { font-family: var(--font-head); font-size: 1.25rem; display: block; line-height: 1; } .fd .kc small { color: var(--muted); font-size: .65rem; }
.fd .time { font-size: .72rem; color: var(--muted); }
.fab { position: fixed; inset-inline-end: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 2rem; line-height: 1; display: grid; place-items: center; cursor: pointer; z-index: 25; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.fab:active { transform: scale(.94); }

[hidden] { display: none !important; }
.exth { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; flex: none; background: var(--surface-2); }
.exhero { display: block; width: 100%; max-height: 240px; object-fit: cover; border-radius: 14px; background: var(--surface-2); }

/* Habits tab */
.hb-sum { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: linear-gradient(135deg, #1c2412, #0f1208 70%); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
.hb-sum .lbl { font-size: .78rem; color: var(--muted); }
.hb-sum .num { font-family: var(--font-head); font-size: 2.4rem; font-weight: 800; line-height: 1.05; margin-block: 4px; }
.hb-sum .msg { font-size: .85rem; color: var(--accent); }
.hb-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 12px 14px; }
.hb-row.off { opacity: .55; }
.hb-ic { width: 48px; height: 48px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); display: grid; place-items: center; font-size: 1.4rem; flex: none; }
.hb-row .nm { font-weight: 700; line-height: 1.25; }
.hb-row .fq { color: var(--muted); font-size: .75rem; margin-block-start: 2px; }
.hb-ed { width: 40px; height: 40px; background: var(--surface-2); }
.hb-ck { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: none; color: var(--accent-ink); display: grid; place-items: center; font-size: 1.1rem; cursor: pointer; flex: none; }
.hb-ck.on { background: var(--accent); border-color: var(--accent); }
.hb-ck.auto { border-style: dashed; }
.ic-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.ic-pick button { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface-2); font-size: 1.3rem; cursor: pointer; }
.ic-pick button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--surface-2)); }

/* Unified icons (see js/icons.js) */
.ui-i { width: 1.1em; height: 1.1em; vertical-align: -0.17em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav a .ico .ui-i { width: 1.35em; height: 1.35em; vertical-align: middle; }
.icon-btn .ui-i { width: 1.2em; height: 1.2em; vertical-align: middle; }

  .sheet-img { width: 100%; height: auto; border-radius: 12px; display: block; }
  .coach-fig img { filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  :root[data-theme="light"] .coach-fig img { filter: drop-shadow(0 6px 8px rgba(0,0,0,.22)); }
  .hello.coach .bubble { align-self: center; }
</style>
</head>

  var MAP = {
    '✅': 'check-circle', '✓': 'check', '💧': 'droplet', '💪': 'dumbbell', '🏋': 'dumbbell', '🍽': 'utensils', '😴': 'moon',

    '🚀': 'rocket', '🍗': 'drumstick', '💾': 'save', '🏆': 'trophy', '⚠': 'alert', '👍': 'thumbs-up', '🔒': 'lock',
    '🗓': 'calendar-days', '📅': 'calendar', '🎽': 'shirt', '✏': 'pencil', '🏠': 'home', '⚙': 'settings', '⏱': 'timer',
    '✕': 'x', '📝': 'pencil-line', '○': 'circle', '🔊': 'volume', '📳': 'vibrate', '🏁': 'flag', '🌟': 'sparkles', '✨': 'sparkles',
    '🏅': 'medal', '📷': 'camera', '📍': 'map-pin', '📋': 'clipboard', '🛠': 'wrench', '📚': 'book', '🇹🇳': 'flag',
    '▾': 'chevron-down', '▸': 'chevron-right', '‹': 'chevron-left', '›': 'chevron-right',
    '←': 'arrow-left', '→': 'arrow-right', '▲': 'arrow-up', '▼': 'arrow-down', '■': 'minus'
  };
  var keys = Object.keys(MAP).sort(function (a, b) { return b.length - a.length; });
  var RE = new RegExp('(' + keys.join('|') + ')\\uFE0F?', 'g');
  var SKIP = { OPTION: 1, SELECT: 1, TEXTAREA: 1, SCRIPT: 1, STYLE: 1, TITLE: 1, SVG: 1, svg: 1 };

  function make(name) {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'ui-i'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
    s.innerHTML = ICONS[name];
    return s;
  }
  // ‹ › are mirrored by the browser inside right-to-left text; an SVG is not, so do it by hand.
  function pick(glyph, node) {
    var name = MAP[glyph];
    if ((glyph === '‹' || glyph === '›') && node.parentNode && getComputedStyle(node.parentNode).direction === 'rtl') {
      name = glyph === '‹' ? 'chevron-right' : 'chevron-left';
    }
    return name;
  }
  function fix(node) {
    var txt = node.nodeValue;
    RE.lastIndex = 0;
    if (!RE.test(txt)) return;
    RE.lastIndex = 0;
    var frag = document.createDocumentFragment(), last = 0, m;
    while ((m = RE.exec(txt))) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      frag.appendChild(make(pick(m[1], node)));
      last = m.index + m[0].length;
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  function scan(root) {
    if (!root) return;
    if (root.nodeType === 3) { if (root.parentNode && !SKIP[root.parentNode.nodeName]) fix(root); return; }
    if (root.nodeType !== 1 || SKIP[root.nodeName]) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), list = [], n;
    while ((n = w.nextNode())) { if (!SKIP[n.parentNode.nodeName]) list.push(n); }
    list.forEach(fix);
  }
  function start() {
    scan(document.body);
    new MutationObserver(function (recs) {
      recs.forEach(function (r) {
        if (r.type === 'characterData') scan(r.target);
        else r.addedNodes.forEach(scan);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  window.UIIcons = { ICONS: ICONS, MAP: MAP, scan: scan };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);
})();

<script>
/* SAYEH SPORT PLUS — core: state, local database, translations, router, UI helpers.
 *
 * Data shapes used across modules (all stored in IndexedDB, key "id"):
 *   water      { id, date:'YYYY-MM-DD', ml, ts }
 *   meals      { id, date, meal:'breakfast|lunch|dinner|snack', name, grams, kcal, p, c, f, fiber, ts }
 *   sleep      { id, date (wake-up day), bed:'HH:MM', wake:'HH:MM', minutes, quality(1-5|null), note, ts }
 *   workouts   { id, date, programId, dayName, startTs, endTs, durationSec, exercises:[{exId,name,sets:[{reps,kg,done}]}] }
 *   programs   { id, name, days:[{id,name,exercises:[{exId,name,sets,reps,restSec,kg,note}]}] }
 *   attendance { id, date, status:'done|missed', reason, note }
 *   goals, tasks, bagLists, xpLog, customExercises, foods, savedMeals — defined by their modules.
 */
(function () {
  'use strict';

  /* ---------- small helpers ---------- */
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };

  function deepMerge(base, extra) {
    if (!extra || typeof extra !== 'object') return base;
    Object.keys(extra).forEach((k) => {
      if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) {
        deepMerge(base[k], extra[k]);
      } else base[k] = extra[k];
    });
    return base;
  }

  /* ---------- settings state (small data -> localStorage) ---------- */
  const LS_KEY = 'ssp_state_v1';
  const DEFAULT_STATE = {
    lang: 'tn',
    theme: 'dark',
    onboarded: false,
    xp: 0,
    profile: {
      name: '', sex: '', age: '', height: '', weight: '',
      goal: 'muscle', experience: 'beginner',
      days: [1, 3, 5], duration: 60,
      workStart: '08:00', workEnd: '17:00',
      sleepTarget: 8,
    },
    targets: { water: 2500, kcal: 2400, protein: 150, carb: 260, fat: 70 },
    notif: { workout: true, bag: true, water: true, meals: false, sleep: false, goals: false, tasks: false, prayer: false, words: true },
    activeProgramId: null,
    xpRules: { workout: 50, pr: 10, nutrition: 10, water: 5, sleep: 5, goal: 100 },
    wprefs: { sound: true, vibrate: true },
  };

  let state = (function load() {
    const s = clone(DEFAULT_STATE);
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) deepMerge(s, JSON.parse(raw));
    } catch (e) { /* corrupted settings: fall back to defaults */ }
    return s;
  })();

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; }
    catch (e) { toast(t('msg.saveFail')); return false; }
  }

  /* ---------- local database (IndexedDB) ---------- */
  const DB_NAME = 'ssp_db';
  const DB_VER = 1;
  const STORES = ['workouts', 'programs', 'customExercises', 'foods', 'savedMeals', 'meals', 'water', 'sleep', 'attendance', 'goals', 'tasks', 'bagLists', 'xpLog', 'misc'];
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB unsupported')); return; }
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach((s) => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  function tx(store, mode, fn) {
    return openDB().then((db) => new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const os = t.objectStore(store);
      let result;
      const r = fn(os);
      if (r) r.onsuccess = () => { result = r.result; };
      t.oncomplete = () => resolve(result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    }));
  }

  const DB = {
    put(store, obj) { if (!obj.id) obj.id = uid(); return tx(store, 'readwrite', (os) => os.put(obj)).then(() => obj); },
    get(store, id) { return tx(store, 'readonly', (os) => os.get(id)); },
    all(store) { return tx(store, 'readonly', (os) => os.getAll()).then((r) => r || []); },
    del(store, id) { return tx(store, 'readwrite', (os) => os.delete(id)); },
    clear(store) { return tx(store, 'readwrite', (os) => os.clear()); },
    async dump() {
      const data = {};
      for (const s of STORES) data[s] = await DB.all(s);
      return data;
    },
    async restore(data) {
      for (const s of STORES) {
        await DB.clear(s);
        const rows = Array.isArray(data[s]) ? data[s] : [];
        for (const r of rows) if (r && r.id) await DB.put(s, r);
      }
    },
  };

  /* ---------- translations ---------- */
  const LANGS = {
    tn: { label: 'التونسية', dir: 'rtl', locale: 'ar-TN-u-nu-latn', htmlLang: 'ar-TN' },
    ar: { label: 'العربية الفصحى', dir: 'rtl', locale: 'ar-u-nu-latn', htmlLang: 'ar' },
    fr: { label: 'Français', dir: 'ltr', locale: 'fr-FR', htmlLang: 'fr' },
    en: { label: 'English', dir: 'ltr', locale: 'en-GB', htmlLang: 'en' },
  };
  const STR = { tn: {}, ar: {}, fr: {}, en: {} };

  function addStrings(pack) {
    Object.keys(pack).forEach((lang) => { if (STR[lang]) Object.assign(STR[lang], pack[lang]); });
  }

  function t(key, vars) {
    let s = STR[state.lang][key];
    if (s == null) s = STR.tn[key];
    if (s == null) s = STR.en[key];
    if (s == null) return key;
    if (vars) Object.keys(vars).forEach((k) => { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  function applyLang() {
    const L = LANGS[state.lang];
    document.documentElement.lang = L.htmlLang;
    document.documentElement.dir = L.dir;
    applyTheme();
  }

  function applyTheme() {
    const m = state.theme || 'dark';
    const r = m === 'system' ? ((window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark') : m;
    document.documentElement.setAttribute('data-theme', r);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', r === 'light' ? '#f4f5f2' : '#0b0b0c');
  }
  function setTheme(m) { state.theme = m; save(); applyTheme(); }
  const themeIco = () => (document.documentElement.getAttribute('data-theme') === 'light' ? '🌙' : '☀️');
  if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (state.theme === 'system') applyTheme(); }); } catch (e) { /* ignore */ } }

  function setLang(lang) {
    if (!LANGS[lang]) return;
    state.lang = lang; save(); applyLang(); render();
  }

  const fmtDate = (d, opts) => new Intl.DateTimeFormat(LANGS[state.lang].locale, opts || { weekday: 'long', day: 'numeric', month: 'long' }).format(d);

  /* ---------- UI helpers ---------- */
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  function modal(html) {
    const root = document.getElementById('modal-root');
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    root.appendChild(back);
    const close = () => { back.remove(); };
    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    return { el: back.firstChild, close };
  }

  function confirmBox(message, okLabel) {
    return new Promise((resolve) => {
      const m = modal('<p>' + esc(message) + '</p><div class="row"><button class="btn grow" data-r="0">' + esc(t('common.cancel')) +
        '</button><button class="btn danger grow" data-r="1">' + esc(okLabel || t('common.confirm')) + '</button></div>');
      m.el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-r]');
        if (!b) return;
        m.close(); resolve(b.dataset.r === '1');
      });
    });
  }

  /* Assets: the user's MS logo and cartoon coach go in /assets. Until then, clearly labelled placeholders. */
  function logoFail(img) {
    const span = document.createElement('span');
    span.textContent = 'MS'; span.title = t('asset.logoPlaceholder');
    img.replaceWith(span);
  }
  function logoHTML() {
    return '<span class="logo-box"><img src="' + window.__A['assets/logo-mark.webp'] + '" alt="MS" onerror="App.logoFail(this)"></span>';
  }
  // the full original logo (MS monogram with SAYEH SPORT PLUS beneath it), shown as supplied
  function logoFullFail(img) {
    const wrap = document.createElement('div');
    wrap.innerHTML = '<span class="logo-box"><span>MS</span></span><div class="app-name">SAYEH SPORT PLUS</div>';
    img.replaceWith(wrap);
  }
  function logoFullHTML() {
    return '<img class="logo-full" src="' + window.__A['assets/logo.webp'] + '" alt="SAYEH SPORT PLUS" onerror="App.logoFullFail(this)">';
  }
  // The single coach lives in js/coach.js, which replaces this stub at load time.
  function coachFail(img) { img.remove(); }
  function coachHTML() { return ''; }

  /* ---------- XP and levels ----------
   * 100 levels. Levels only track your XP; the coach is one fixed character (see js/coach.js).
   */
  const MAX_LEVEL = 100;
  const xpForLevel = (L) => (L <= 1 ? 0 : Math.round(25 * Math.pow(L - 1, 1.5)));
  function levelInfo(xp) {
    xp = xp == null ? state.xp : xp;
    let level = 1;
    while (level < MAX_LEVEL && xp >= xpForLevel(level + 1)) level += 1;
    const cur = xpForLevel(level);
    const next = level < MAX_LEVEL ? xpForLevel(level + 1) : null;
    return {
      level, xp, cur, next, pct: next ? Math.round(((xp - cur) / (next - cur)) * 100) : 100,
    };
  }
  async function addXp(amount, reason, key) {
    if (!amount) return;
    await DB.put('xpLog', { date: dateKey(), amount, reason: reason || '', key: key || null, ts: Date.now() });
    state.xp = Math.max(0, state.xp + amount); save();
  }
  // award XP at most once for a given key (e.g. 'water:2026-10-26'); returns true when it was awarded
  async function awardOnce(key, reason, amount) {
    if (!amount) return false;
    const log = await DB.all('xpLog');
    if (log.some((r) => r.key === key)) return false;
    await addXp(amount, reason, key);
    return true;
  }
  const xpRules = () => Object.assign({ workout: 50, pr: 10, nutrition: 10, water: 5, sleep: 5, goal: 100 }, state.xpRules || {});
  // one string in the four languages: S(key, tn, ar, fr, en)
  function S(k, tn, ar, fr, en) { addStrings({ tn: { [k]: tn }, ar: { [k]: ar }, fr: { [k]: fr }, en: { [k]: en } }); }

  /* ---------- router ---------- */
  const NAV = [
    { id: 'home', ico: '🏠', key: 'nav.home' },
    { id: 'train', ico: '🏋️', key: 'nav.train' },
    { id: 'nutrition', ico: '🍽️', key: 'nav.nutrition' },
    { id: 'habits', ico: '💧', key: 'nav.habits' },
    { id: 'progress', ico: '📈', key: 'nav.progress' },
  ];
  const views = {};
  function registerView(id, fn) { views[id] = fn; }
  const current = () => (location.hash.replace(/^#\/?/, '').split('/')[0] || 'home');
  function go(id) { if (current() === id) render(); else location.hash = '#/' + id; }

  function shell(inner, active) {
    const nav = NAV.map((n) => '<a href="#/' + n.id + '"' + (n.id === active ? ' aria-current="page"' : '') + '><span class="ico" aria-hidden="true">' + n.ico + '</span><span>' + esc(t(n.key)) + '</span></a>').join('');
    return '<div class="shell"><header class="topbar"><div class="brand">' + logoHTML() + '<b>SAYEH SPORT PLUS</b></div>' +
      '<span class="row" style="gap:6px"><a class="icon-btn" href="#/bag" aria-label="' + esc(t('pl.tab.bag')) + '" style="text-decoration:none">🎒</a><button type="button" class="icon-btn" data-themetoggle aria-label="Theme">' + themeIco() + '</button><a class="icon-btn" href="#/settings" aria-label="' + esc(t('nav.settings')) + '" style="text-decoration:none">⚙️</a></span></header>' +
      '<main class="view" id="view">' + inner + '</main><nav class="nav" aria-label="main">' + nav + '</nav></div>';
  }

  async function render() {
    const app = document.getElementById('app');
    app.onclick = null; app.oninput = null; app.onchange = null;
    if (!state.onboarded) { views.onboarding(app); return; }
    const id = current();
    const fn = views[id];
    if (fn && fn.fullscreen) {
      app.innerHTML = '';
      try { await fn(app); } catch (err) { console.error(err); app.innerHTML = '<div class="card"><p>' + esc(t('msg.error')) + '</p></div>'; }
      window.scrollTo(0, 0);
      return;
    }
    app.innerHTML = shell('', id === 'settings' ? '' : id);
    const root = document.getElementById('view');
    try {
      if (fn) await fn(root);
      if (App.coach && App.coach.banner) App.coach.banner(root, id);
      else root.innerHTML = '<div class="card empty"><h2>' + esc(t(NAV.find((n) => n.id === id) ? 'nav.' + id : 'nav.settings')) + '</h2><p>' + esc(t('placeholder.body')) + '</p></div>';
    } catch (err) {
      console.error(err);
      root.innerHTML = '<div class="card"><p>' + esc(t('msg.error')) + '</p></div>';
    }
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-themetoggle]'); if (!b) return;
    setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    b.innerHTML = themeIco();
    if (current() === 'settings') render();
  });

  /* ---------- shared strings ---------- */

<script>
/* Targets calculator: Mifflin-St Jeor resting energy, an activity factor from training days, a goal adjustment, then protein / fat / carbs and water.
 * It only fills the fields; you can change every number. An estimate, not medical advice. */
(function () {
  'use strict';
  const { S } = App;
  S('tg.calc', 'احسب أهدافي تلقائيًا', 'احسب أهدافي تلقائيًا', 'Calculer mes objectifs', 'Calculate my targets');
  S('tg.need', 'عمّر العمر والطول والوزن قبل.', 'أدخل العمر والطول والوزن أولًا.', 'Renseigne d\'abord l\'âge, la taille et le poids.', 'Fill in age, height and weight first.');
  S('tg.result', 'الأساسي (BMR): {bmr} · الاستهلاك اليومي: {tdee} · هدفك: {kcal} كالوري. هذا تقدير، موش نصيحة طبية، وتنجم تبدّل الأرقام.', 'الأساسي (BMR): {bmr} · الاستهلاك اليومي: {tdee} · هدفك: {kcal} سعرة. تقدير وليس نصيحة طبية، ويمكنك تعديل الأرقام.', 'Métabolisme de base : {bmr} · dépense : {tdee} · objectif : {kcal} kcal. Estimation, pas un avis médical ; tu peux modifier les valeurs.', 'Resting: {bmr} · daily burn: {tdee} · target: {kcal} kcal. An estimate, not medical advice; you can edit every number.');
  S('tg.sexNote', 'ما اخترتش الجنس، استعملت قيمة متوسّطة.', 'لم تحدّد الجنس، استُعملت قيمة متوسطة.', 'Sexe non précisé : valeur moyenne utilisée.', 'Sex not set: an average value was used.');
  function calc(p) {
    const w = Number(p.weight), h = Number(p.height), a = Number(p.age);
    if (!(w >= 30 && h >= 100 && a >= 10)) return null;
    const sexAdj = p.sex === 'male' ? 5 : p.sex === 'female' ? -161 : -78;
    const bmr = 10 * w + 6.25 * h - 5 * a + sexAdj;
    const d = (p.days && p.days.length) || 3;
    const tdee = bmr * (d <= 1 ? 1.3 : d <= 2 ? 1.375 : d <= 4 ? 1.55 : 1.725);
    const adj = { muscle: 1.1, strength: 1.05, fitness: 1, fatloss: 0.8, maintain: 1 }[p.goal] || 1;
    const kcal = Math.max(1400, Math.round((tdee * adj) / 50) * 50);
    const pk = { muscle: 2, strength: 1.8, fatloss: 2, fitness: 1.6, maintain: 1.6 }[p.goal] || 1.6;
    const protein = Math.round(w * pk), fat = Math.max(Math.round((kcal * 0.25) / 9), Math.round(w * 0.6));
    const carb = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4));
    const water = Math.round((w * 35 + (d >= 3 ? 400 : 0)) / 100) * 100;
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, fat, carb, water, sexKnown: p.sex === 'male' || p.sex === 'female' };
  }
  App.calcTargets = calc;
})();

      ref: { tn: 'سورة المائدة 5:6 (بداية الآية)', ar: 'سورة المائدة 5:6 (مطلع الآية)', fr: 'Sourate Al-Ma\'ida 5:6 (début du verset)', en: 'Qur\'an 5:6 (Al-Ma\'idah), opening of the verse' },

        tn: 'هذا أصل الوضوء. التفاصيل والأحكام تتاخذ من عالم أو من مصدر موثوق، والتطبيق ما يفتيش.',
        ar: 'هذا أصل الوضوء. التفاصيل والأحكام تؤخذ من أهل العلم أو مصدر موثوق، والتطبيق لا يفتي.',

        en: 'This is the basis of wudu. For details and rulings ask a scholar or a trusted source; the app does not issue rulings.',
      },
    },
  };

  function html(id) {
    const it = ITEMS[id]; if (!it) return '';
    const L = App.state.lang;
    const rot = POOL.indexOf(id) >= 0 ? ' hadith-rot' : '';
    return '<div class="notice stack' + rot + '" data-hadith="' + id + '" title="' + esc(it.ref[L]) + '"><p lang="ar" dir="rtl" style="font-size:1.15rem;line-height:1.9;text-align:center">' + esc(it.ar) + '</p><p class="muted small" style="text-align:center">— ' + esc(it.by ? it.by[L] : it.ref[L]) + '</p></div>';
  }

  // rotating hadith: a different one each time Home opens (and on tap). Only hadiths whose wording and source were checked are listed.
  const HADITHS = ['strongBeliever', 'grace', 'consistency', 'strength'];
  const POOL = HADITHS.concat(['moderation', 'prayer']);   // verified hadiths + verified verses; each shows text and source only
  function rotating() {
    let i = 0;
    try { i = (Number(localStorage.getItem('ssp_hadith_idx')) + 1) % POOL.length; localStorage.setItem('ssp_hadith_idx', String(i)); } catch (e) { i = Math.floor(Math.random() * POOL.length); }
    return html(POOL[i]);
  }
  document.addEventListener('click', (e) => {
    const box = e.target.closest('.hadith-rot'); if (!box) return;
    const next = POOL[(POOL.indexOf(box.dataset.hadith) + 1) % POOL.length];
    const tmp = document.createElement('div'); tmp.innerHTML = html(next); box.replaceWith(tmp.firstChild);
  });
  App.guidance = { ITEMS, html, rotating, HADITHS, POOL };
})();

          '<p class="muted small">' + esc(t('onb.notif.note')) + '</p></div>' +
          '<div class="card stack"><h2>' + esc(t('onb.features.title')) + '</h2><ul style="margin:0;padding-inline-start:20px">' +
          t('onb.features.list').split('|').map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
      }
    }
  }

  function readInputs(root) {
    const g = (id) => root.querySelector('#' + id);
    const p = draft.profile;
    if (step === 1) { p.name = g('name').value.trim(); p.age = g('age').value; p.height = g('height').value; p.weight = g('weight').value; }
    if (step === 3) { p.duration = Number(g('duration').value) || 60; p.workStart = g('workStart').value || '08:00'; p.workEnd = g('workEnd').value || '17:00'; }
    if (step === 4) { p.sleepTarget = Number(g('sleepTarget').value) || 8; draft.targets.water = Number(g('water').value) || 2500; draft.targets.kcal = Number(g('kcal').value) || 2400; }
  }

  function validate() {
    const p = draft.profile;
    if (step === 1) {
      if (!p.name) return t('onb.err.name');
      const bad = (v, lo, hi) => v !== '' && !(Number(v) >= lo && Number(v) <= hi);
      if (bad(p.age, 10, 100) || bad(p.height, 100, 250) || bad(p.weight, 30, 300)) return t('onb.err.num');
    }
    if (step === 3 && !p.days.length) return t('onb.err.days');
    return null;
  }

  function paint(app) {
    const dots = Array.from({ length: STEPS }, (_, i) => '<i class="' + (i === step ? 'on' : '') + '"></i>').join('');
    app.innerHTML = '<div class="onb"><div class="onb-logo">' + App.logoFullHTML() + '</div>' +
      '<div class="dots" aria-hidden="true">' + dots + '</div>' + body() +
      '<div class="onb-actions">' + (step > 0 ? '<button class="btn" data-act="back">' + esc(t('common.back')) + '</button>' : '') +
      '<button class="btn primary" data-act="next">' + esc(step === 0 ? t('common.start') : step === STEPS - 1 ? t('common.finish') : t('common.next')) + '</button></div></div>';
  }

  App.registerView('onboarding', function (app) {
    if (!draft) {
      draft = { profile: App.clone(App.state.profile), targets: App.clone(App.state.targets), notif: App.clone(App.state.notif) };
    }
    paint(app);
    app.onclick = function (e) {
      const chip = e.target.closest('[data-chip]');
      if (chip) {
        const name = chip.dataset.chip; const v = chip.dataset.v;
        if (name === 'lang') { readInputs(app); App.setLang(v); return; }
        if (name === 'days') {
          const n = Number(v); const arr = draft.profile.days;
          draft.profile.days = arr.includes(n) ? arr.filter((x) => x !== n) : arr.concat(n).sort();
        } else draft.profile[name] = (name === 'sex' && draft.profile.sex === v) ? '' : v;
        readInputs(app); paint(app); return;
      }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      if (btn.dataset.act === 'back') { readInputs(app); step = Math.max(0, step - 1); paint(app); window.scrollTo(0, 0); return; }
      if (btn.dataset.act === 'calc') {
        readInputs(app);
        const r = App.calcTargets(draft.profile);
        if (!r) { App.toast(t('tg.need')); return; }
        Object.assign(draft.targets, { kcal: r.kcal, protein: r.protein, carb: r.carb, fat: r.fat, water: r.water });
        calcNote = t('tg.result', { bmr: r.bmr, tdee: r.tdee, kcal: r.kcal }) + (r.sexKnown ? '' : ' ' + t('tg.sexNote'));
        paint(app); return;
      }
      readInputs(app);
      const err = validate();
      if (err) { App.toast(err); return; }
      if (step < STEPS - 1) { step += 1; paint(app); window.scrollTo(0, 0); return; }
      // finish
      const s = App.state;
      s.profile = draft.profile; s.targets = draft.targets; s.notif = draft.notif; s.onboarded = true;
      if (!App.save()) return;
      draft = null; step = 0; app.onclick = null; app.oninput = null; app.onchange = null;
      location.hash = '#/home';
      App.render();
    };
    app.onchange = function (e) {
      const n = e.target.closest('[data-notif]');
      if (n) draft.notif[n.dataset.notif] = n.checked;
    };
  });
})();

</script>

(function () {
  'use strict';
  const { DB, S, t } = App, P = 'exImg:';
  S('tr.photo', 'صورة التمرين (اختياري)', 'صورة التمرين (اختياري)', 'Photo de l\'exercice (optionnelle)', 'Exercise photo (optional)');
  S('tr.photoAdd', 'زيد / بدّل صورة', 'أضف / غيّر الصورة', 'Ajouter / changer', 'Add / change');
  S('tr.photoDel', 'امسح الصورة', 'احذف الصورة', 'Retirer la photo', 'Remove photo');
  S('tr.photoErr', 'ما نجمتش نحلّ الصورة.', 'تعذّر فتح الصورة.', 'Impossible d\'ouvrir l\'image.', 'Could not open the image.');
  let cache = null;
  async function load() { if (!cache) { cache = {}; (await DB.all('misc')).forEach((r) => { if (r.id && r.id.indexOf(P) === 0 && r.data) cache[r.id.slice(P.length)] = r.data; }); } return cache; }
  const get = (id) => (cache && cache[id]) || null;
  async function set(id, data) { await load(); cache[id] = data; await DB.put('misc', { id: P + id, data }); }
  async function del(id) { await load(); delete cache[id]; await DB.del('misc', P + id); }
  function shrink(file) {
    return new Promise((resolve) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, 520 / Math.max(img.width, img.height, 1)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.78)); };
      img.onerror = () => resolve(null); img.src = url;
    });
  }
  function pick(id, done) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; document.body.appendChild(inp);
    inp.oncancel = () => inp.remove();
    inp.onchange = async () => { const f = inp.files[0]; inp.remove(); if (!f) return; const d = await shrink(f); if (!d) { App.toast(t('tr.photoErr')); return; } await set(id, d); App.toast(t('msg.saved')); if (done) done(); };
    inp.click();
  }
  App.exImg = { load, get, set, del, pick };
})();
</script>

  /* ---------- exercise helpers shared with workout.js and progress ---------- */
  const ex = {
    async load() {
      const custom = await DB.all('customExercises');
      const list = Lib.EXERCISES.concat(custom);
      const byId = {}; list.forEach((e) => { byId[e.id] = e; });
      return { list, byId };
    },
    name(e, withEn) {
      if (!e) return '?';
      if (!e.builtin) return e.name;
      const L = App.state.lang;
      if (L === 'en') return e.n.en;
      const loc = L === 'fr' ? e.n.fr : e.n.ar;
      return withEn ? loc + ' · ' + e.n.en : loc;
    },
    fallbackName(entry, byId) { const e = byId[entry.exId]; return e ? ex.name(e, true) : (entry.nm || entry.exId); },
    group(g) { return (Lib.GROUP_NAMES[g] || { [App.state.lang]: g })[App.state.lang] || g; },
    unit(u) { return t('u.' + (u || 'reps')); },
  };
  App.ex = ex;

  /* ---------- state of this screen ---------- */
  let mode = 'home';            // home | templates | wizard | editor | library
  let draft = null;             // program being edited
  let draftIsNew = false;
  let tplOpen = null;
  let pickDay = null;
  let wiz = null;
  let wizResult = null;

  const L = () => App.state.lang;
  const tplName = (tpl) => tpl.name[L()] || tpl.name.en;
  const sentence = (e, byId) => esc(ex.fallbackName(e, byId));

  function newEntry(exercise) {
    return { exId: exercise.id, nm: exercise.builtin ? exercise.n.en : exercise.name, sets: exercise.sets, reps: exercise.reps, rest: exercise.rest, kg: '', note: '' };
  }

  function programFromTemplate(tpl, maxEx) {
    return {
      id: App.uid(), name: tplName(tpl), createdAt: Date.now(), source: 'template',
      days: tpl.days.map((d) => ({
        id: App.uid(), name: d.name,
        exercises: d.ex.slice(0, maxEx || 99).map((id) => newEntry(Lib.BY_ID[id])),
      })),
    };
  }

  function applyScheme(program, goal, experience) {
    const kindOf = (id) => (Lib.BY_ID[id] ? Lib.BY_ID[id].kind : 'i');
    program.days.forEach((d) => d.exercises.forEach((e) => {
      const kind = kindOf(e.exId);
      if (kind === 's' || kind === 'm') return;
      const compound = kind === 'c';
      if (goal === 'strength') Object.assign(e, compound ? { sets: 4, reps: 5, rest: 180 } : { sets: 3, reps: 10, rest: 90 });
      else if (goal === 'muscle') Object.assign(e, compound ? { sets: 3, reps: experience === 'beginner' ? 10 : 8, rest: 120 } : { sets: 3, reps: 12, rest: 75 });
      else Object.assign(e, compound ? { sets: 3, reps: 10, rest: 90 } : { sets: 3, reps: kind === 'k' ? 15 : 12, rest: 60 });
      if (experience === 'beginner') e.sets = Math.min(e.sets, 3);
      if (experience === 'advanced' && compound && goal !== 'fitness' && goal !== 'fatloss' && goal !== 'maintain') e.sets += 1;
    }));
    return program;
  }

  function suggest(w) {
    const n = Number(w.days);
    let id;
    if (n <= 2) id = 'fb2';
    else if (n === 3) id = (w.experience !== 'beginner' && w.goal === 'muscle') ? 'ppl3' : 'fb3';
    else if (n === 4) id = (w.experience === 'advanced' && w.goal === 'muscle') ? 'ulspec4' : 'ul4';
    else id = 'ppl6';
    const tpl = Lib.TEMPLATES.find((x) => x.id === id);
    const perDay = Math.max(4, Math.min(8, Math.round(w.duration / 10)));
    const prog = applyScheme(programFromTemplate(tpl, perDay), w.goal, w.experience);
    prog.source = 'personalized';
    const goalKey = w.goal === 'muscle' ? 'muscle' : w.goal === 'strength' ? 'strength' : 'general';
    const reasons = [t('tr.why.days', { n, tpl: tplName(tpl) }), t('tr.why.' + goalKey), t('tr.why.' + w.experience), t('tr.why.dur', { m: w.duration, n: perDay })];
    if (n >= 5) reasons.push(t('tr.why.five'));
    reasons.push(t('tr.why.safe'));
    return { program: prog, reasons };
  }

  /* ---------- program storage ---------- */
  const programs = () => DB.all('programs').then((l) => l.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)));
  async function saveProgram(p, activate) {
    await DB.put('programs', p);
    if (activate || !App.state.activeProgramId) { App.state.activeProgramId = p.id; App.save(); }
  }

  async function nextDayIndex(program) {
    const ws = (await DB.all('workouts')).filter((w) => w.programId === program.id && w.dayIndex != null).sort((a, b) => b.startTs - a.startTs);
    if (!ws.length) return 0;
    return (ws[0].dayIndex + 1) % program.days.length;
  }

  /* ---------- renderers ---------- */
  const detail = (e, byId) => {
    const x = byId[e.exId]; const unit = x ? x.unit : 'reps';
    return esc(e.sets + ' × ' + e.reps + ' ' + ex.unit(unit) + (e.kg ? ' · ' + e.kg + ' kg' : ''));
  };

  async function viewHome(root) {
    const progs = await programs();
    const { byId } = await ex.load();
    const active = progs.find((p) => p.id === App.state.activeProgramId);
    const draftW = await DB.get('misc', 'activeWorkout');
    let html = '';
    if (active) {
      const idx = pickDay != null && pickDay < active.days.length ? pickDay : await nextDayIndex(active);
      pickDay = idx;
      const day = active.days[idx];
      const planned = App.state.profile.days.includes(new Date().getDay());
      html += '<div class="card stack"><div class="card-head"><h2>' + esc(t('tr.next')) + '</h2><span class="badge">' + esc(active.name) + '</span></div>' +
        '<p class="muted small">' + esc(planned ? t('tr.plannedToday') : t('tr.restToday')) + '</p>' +
        '<h3>' + esc(day.name) + '</h3><div class="stack">' + day.exercises.map((e) => '<div class="row small"><span class="grow">' + sentence(e, byId) + '</span><span class="muted">' + detail(e, byId) + '</span></div>').join('') + '</div>' +
        (draftW ? '<button class="btn primary block" data-act="resume">' + esc(t('tr.resume')) + '</button>' : '<button class="btn primary block" data-act="start">' + esc(t('tr.start')) + '</button>') +
        '<span class="muted small">' + esc(t('tr.chooseDay')) + '</span><div class="chips">' +
        active.days.map((d, i) => '<button class="chip" data-act="pickday" data-i="' + i + '" aria-pressed="' + (i === idx) + '">' + esc(d.name) + '</button>').join('') + '</div></div>';
    } else {
      html += '<div class="card"><p>' + esc(t('tr.noProgram')) + '</p></div>';
    }
    const opt = (act, ico, title, desc) => '<div class="card tap row" data-act="' + act + '"><span style="font-size:1.6rem">' + ico + '</span><div class="grow"><h3>' + esc(title) + '</h3><p class="muted small">' + esc(desc) + '</p></div><span aria-hidden="true">›</span></div>';
    html += opt('templates', '📋', t('tr.optA'), t('tr.optADesc')) + opt('new', '🛠️', t('tr.optB'), t('tr.optBDesc')) + opt('wizard', '✨', t('tr.optC'), t('tr.optCDesc')) +
      opt('library', '📚', t('tr.library'), Lib.EXERCISES.length + '+');
    if (progs.length) {
      html += '<div class="card stack"><h2>' + esc(t('tr.myPrograms')) + '</h2>' + progs.map((p) =>
        '<div class="stack"><div class="row"><b class="grow">' + esc(p.name) + '</b>' + (p.id === App.state.activeProgramId ? '<span class="badge">' + esc(t('tr.active')) + '</span>' : '') + '</div>' +
        '<p class="muted small">' + p.days.length + ' ' + esc(t('tr.days')) + ' · ' + p.days.reduce((a, d) => a + d.exercises.length, 0) + ' ' + esc(t('tr.exercises')) + '</p>' +
        '<div class="chips">' + (p.id === App.state.activeProgramId ? '' : '<button class="chip" data-act="activate" data-id="' + p.id + '">' + esc(t('tr.activate')) + '</button>') +
        '<button class="chip" data-act="edit" data-id="' + p.id + '">' + esc(t('tr.edit')) + '</button><button class="chip" data-act="dup" data-id="' + p.id + '">' + esc(t('tr.dup')) + '</button>' +
        '<button class="chip" data-act="del" data-id="' + p.id + '">' + esc(t('tr.del')) + '</button></div><div class="divider"></div></div>').join('') + '</div>';
    }
    root.innerHTML = html;
  }
