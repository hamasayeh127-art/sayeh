    const d = draft;
    root.innerHTML = backBar(draftIsNew ? t('tr.ed.new') : t('tr.ed.title')) +
      '<div class="card stack"><label class="field"><span>' + esc(t('tr.ed.name')) + '</span><input type="text" id="pname" maxlength="60" value="' + esc(d.name) + '"></label></div>' +
      d.days.map((day, di) =>
        '<div class="card stack"><label class="field"><span>' + esc(t('tr.ed.dayName')) + '</span><input type="text" class="dname" data-d="' + di + '" maxlength="40" value="' + esc(day.name) + '"></label>' +
        (day.exercises.length ? day.exercises.map((e, ei) =>
          '<div class="row">' + (App.exImg.get(e.exId) ? '<img class="exth" src="' + App.exImg.get(e.exId) + '" alt="">' : '') + '<div class="grow"><b class="small">' + sentence(e, byId) + '</b><p class="muted small">' + detail(e, byId) + ' · ' + e.rest + 's' + (e.note ? ' · ' + esc(e.note) : '') + '</p></div>' +
          '<button class="icon-btn" data-act="exup" data-d="' + di + '" data-e="' + ei + '" aria-label="up">▲</button><button class="icon-btn" data-act="exdown" data-d="' + di + '" data-e="' + ei + '" aria-label="down">▼</button>' +
          '<button class="icon-btn" data-act="exedit" data-d="' + di + '" data-e="' + ei + '" aria-label="' + esc(t('common.edit')) + '">✏️</button>' +
          '<button class="icon-btn" data-act="exdel" data-d="' + di + '" data-e="' + ei + '" aria-label="' + esc(t('common.delete')) + '">🗑️</button></div>').join('')
          : '<p class="muted small">' + esc(t('tr.ed.empty')) + '</p>') +
        '<div class="chips"><button class="chip" data-act="addex" data-d="' + di + '">＋ ' + esc(t('tr.ed.addEx')) + '</button>' +
        '<button class="chip" data-act="dayup" data-d="' + di + '">▲</button><button class="chip" data-act="daydown" data-d="' + di + '">▼</button>' +
        '<button class="chip" data-act="dupday" data-d="' + di + '">' + esc(t('tr.ed.dupDay')) + '</button><button class="chip" data-act="delday" data-d="' + di + '">' + esc(t('tr.ed.delDay')) + '</button></div></div>').join('') +
      '<button class="btn block" data-act="addday">＋ ' + esc(t('tr.ed.addDay')) + '</button>' +
      '<div class="row"><button class="btn grow" data-act="home">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" data-act="edsave">' + esc(t('common.save')) + '</button></div>';
  }

  async function viewLibrary(root, query, group) {
    const { list } = await ex.load(); await App.exImg.load();
    const q = (query || '').trim().toLowerCase();
    const rows = list.filter((e) => (!group || e.g === group) && (!q || [e.id, e.name, e.n && e.n.en, e.n && e.n.fr, e.n && e.n.ar].filter(Boolean).join(' ').toLowerCase().includes(q)));
    const chips = ['', ...Lib.GROUPS].map((g) => '<button class="chip" data-act="libgroup" data-g="' + g + '" aria-pressed="' + ((group || '') === g) + '">' + esc(g ? ex.group(g) : t('tr.all')) + '</button>').join('');
    root.innerHTML = backBar(t('tr.library')) + '<input type="text" id="libq" placeholder="' + esc(t('tr.search')) + '" value="' + esc(query || '') + '"><div class="chips">' + chips + '</div>' +
      '<button class="btn block" data-act="newex">＋ ' + esc(t('tr.newEx')) + '</button>' +
      (rows.length ? '<div class="card stack">' + rows.map((e) => '<div class="row">' + (App.exImg.get(e.id) ? '<img class="exth" src="' + App.exImg.get(e.id) + '" alt="">' : '') + '<div class="grow"><b class="small">' + esc(ex.name(e, true)) + '</b><p class="muted small">' + esc(ex.group(e.g)) + (e.builtin ? '' : ' · ' + esc(t('tr.custom'))) + '</p></div>' +
        '<button class="icon-btn" data-act="imgadd" data-id="' + e.id + '" aria-label="' + esc(t('tr.photoAdd')) + '">📷</button>' + (App.exImg.get(e.id) ? '<button class="icon-btn" data-act="imgdel" data-id="' + e.id + '" aria-label="' + esc(t('tr.photoDel')) + '">✕</button>' : '') +
        (e.builtin ? '' : '<button class="icon-btn" data-act="delcx" data-id="' + e.id + '" aria-label="' + esc(t('common.delete')) + '">🗑️</button>') + '</div>').join('') + '</div>'
        : '<div class="empty">' + esc(t('tr.noResults')) + '</div>');
    libState.q = q; libState.g = group || '';
  }
  const libState = { q: '', g: '' };

  /* ---------- modals ---------- */
  async function openPicker(onPick) {
    const { list } = await ex.load();
    const m = App.modal('<h2>' + esc(t('tr.library')) + '</h2><input type="text" id="pq" placeholder="' + esc(t('tr.search')) + '"><div class="chips" id="pg"></div><div class="stack" id="pl"></div><button class="btn block" id="pnew">＋ ' + esc(t('tr.newEx')) + '</button><button class="btn block" id="pclose">' + esc(t('common.close')) + '</button>');
    let g = ''; let q = '';
    const el = m.el;
    function paint() {
      el.querySelector('#pg').innerHTML = ['', ...Lib.GROUPS].map((x) => '<button class="chip" data-g="' + x + '" aria-pressed="' + (g === x) + '">' + esc(x ? ex.group(x) : t('tr.all')) + '</button>').join('');
      const rows = list.filter((e) => (!g || e.g === g) && (!q || [e.id, e.name, e.n && e.n.en, e.n && e.n.fr, e.n && e.n.ar].filter(Boolean).join(' ').toLowerCase().includes(q)));
      el.querySelector('#pl').innerHTML = rows.length ? rows.map((e) => '<button class="btn" style="justify-content:flex-start;text-align:start" data-id="' + e.id + '">' + esc(ex.name(e, true)) + '</button>').join('') : '<div class="empty">' + esc(t('tr.noResults')) + '</div>';
    }
    paint();
    el.querySelector('#pq').oninput = (e) => { q = e.target.value.trim().toLowerCase(); paint(); };
    el.onclick = (e) => {
      const gb = e.target.closest('#pg [data-g]'); if (gb) { g = gb.dataset.g; paint(); return; }
      const it = e.target.closest('#pl [data-id]'); if (it) { m.close(); onPick(list.find((x) => x.id === it.dataset.id)); return; }
      if (e.target.closest('#pnew')) { m.close(); openCustomForm(onPick); return; }
      if (e.target.closest('#pclose')) m.close();
    };
  }

  function openCustomForm(onDone) {
    const m = App.modal('<h2>' + esc(t('tr.newEx')) + '</h2>' +
      '<label class="field"><span>' + esc(t('tr.cx.name')) + '</span><input type="text" id="cxn" maxlength="60"></label>' +
      '<label class="field"><span>' + esc(t('tr.cx.group')) + '</span><select id="cxg">' + Lib.GROUPS.map((g) => '<option value="' + g + '">' + esc(ex.group(g)) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>' + esc(t('tr.cx.unit')) + '</span><select id="cxu"><option value="reps">' + esc(t('u.reps')) + '</option><option value="sec">' + esc(t('u.sec')) + '</option><option value="min">' + esc(t('u.min')) + '</option></select></label>' +
      '<div class="row"><button class="btn grow" id="cxc">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" id="cxs">' + esc(t('common.save')) + '</button></div>');
    let busy = false;
    m.el.onclick = async (e) => {
      if (e.target.closest('#cxc')) { m.close(); return; }
      if (!e.target.closest('#cxs') || busy) return;
      const name = m.el.querySelector('#cxn').value.trim();
      if (!name) { App.toast(t('tr.cx.errName')); return; }
      busy = true;
      const unit = m.el.querySelector('#cxu').value;
      const base = Lib.DEFAULTS[unit === 'reps' ? 'i' : unit === 's' ? 's' : unit === 'sec' ? 's' : 'm'];
      const item = { id: 'cx_' + App.uid(), builtin: false, name, g: m.el.querySelector('#cxg').value, kind: unit === 'reps' ? 'i' : unit === 'sec' ? 's' : 'm', sets: base.sets, reps: base.reps, rest: base.rest, unit };
      await DB.put('customExercises', item);
      m.close(); App.toast(t('msg.saved')); if (onDone) onDone(item);
    };
  }

  function openExEdit(day, ei, done) {
    const e = draft.days[day].exercises[ei];
    const f = (id, label, v, extra) => '<label class="field"><span>' + esc(label) + '</span><input type="number" inputmode="decimal" id="' + id + '" value="' + esc(v) + '" ' + (extra || '') + '></label>';
    const m = App.modal('<h2>' + esc(e.nm) + '</h2><div class="grid2">' + f('es', t('tr.ed.sets'), e.sets, 'min="1" max="12"') + f('er', t('tr.ed.reps'), e.reps, 'min="1" max="200"') + '</div><div class="grid2">' +
      f('et', t('tr.ed.rest'), e.rest, 'min="0" max="600" step="5"') + f('ek', t('tr.ed.kg'), e.kg, 'min="0" max="500" step="0.5"') + '</div>' +
      '<label class="field"><span>' + esc(t('tr.ed.note')) + '</span><input type="text" id="en" maxlength="120" value="' + esc(e.note) + '"></label>' +
      '<div class="stack"><span class="muted small">' + esc(t('tr.photo')) + '</span><img id="exprev" class="exhero" ' + (App.exImg.get(e.exId) ? 'src="' + App.exImg.get(e.exId) + '"' : 'hidden') + ' alt=""><div class="row"><button class="chip" id="exph" type="button">📷 ' + esc(t('tr.photoAdd')) + '</button><button class="chip" id="exrm" type="button"' + (App.exImg.get(e.exId) ? '' : ' hidden') + '>' + esc(t('tr.photoDel')) + '</button></div></div>' +
      '<div class="row"><button class="btn grow" id="ec">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" id="eo">' + esc(t('common.save')) + '</button></div>');
    const sync = () => { const u = App.exImg.get(e.exId), pv = m.el.querySelector('#exprev'); if (u) pv.src = u; else pv.removeAttribute('src'); pv.hidden = !u; m.el.querySelector('#exrm').hidden = !u; };
    m.el.onclick = (ev) => {
      if (ev.target.closest('#exph')) { App.exImg.pick(e.exId, sync); return; }
      if (ev.target.closest('#exrm')) { App.exImg.del(e.exId).then(sync); return; }
      if (ev.target.closest('#ec')) { m.close(); return; }
      if (!ev.target.closest('#eo')) return;
      const g = (id) => m.el.querySelector('#' + id).value;
      e.sets = Math.max(1, Math.min(12, Math.round(Number(g('es'))) || 1));
      e.reps = Math.max(1, Math.min(200, Math.round(Number(g('er'))) || 1));
      e.rest = Math.max(0, Math.min(600, Math.round(Number(g('et'))) || 0));
      e.kg = g('ek') === '' ? '' : Math.max(0, Number(g('ek')) || 0);
      e.note = g('en').trim();
      m.close(); done();
    };
  }

  /* ---------- main view ---------- */
  App.registerView('train', async function (root) {
    const rerender = () => show();
    function syncDraft() {
      if (!draft || mode !== 'editor') return;
      const pn = root.querySelector('#pname'); if (pn) draft.name = pn.value.trim();
      root.querySelectorAll('.dname').forEach((i) => { draft.days[Number(i.dataset.d)].name = i.value.trim(); });
    }
    let lastMode = null;
    async function show() {
      const keepY = window.scrollY, same = lastMode === mode;
      if (mode === 'templates') await viewTemplates(root);
      else if (mode === 'wizard') viewWizard(root);
      else if (mode === 'editor') await viewEditor(root);
      else if (mode === 'library') await viewLibrary(root, libState.q, libState.g);
      else await viewHome(root);
      lastMode = mode;
      if (same) window.scrollTo(0, keepY); else window.scrollTo(0, 0);
    }
    function go(m) { mode = m; show(); }

    root.oninput = (e) => { if (e.target.id === 'libq') { libState.q = e.target.value; const pos = e.target.selectionStart; viewLibrary(root, libState.q, libState.g).then(() => { const i = root.querySelector('#libq'); i.focus(); i.setSelectionRange(pos, pos); }); } };
    root.onchange = (e) => {
      if (mode !== 'wizard') return;
      if (e.target.id === 'wgoal') wiz.goal = e.target.value;
      if (e.target.id === 'wexp') wiz.experience = e.target.value;
      if (e.target.id === 'wdays') wiz.days = Number(e.target.value);
      if (e.target.id === 'wdur') wiz.duration = Math.max(20, Math.min(180, Number(e.target.value) || 60));
    };

    root.onclick = async (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const act = b.dataset.act; const id = b.dataset.id; const di = Number(b.dataset.d); const ei = Number(b.dataset.e);
      syncDraft();
      switch (act) {
        case 'home': draft = null; wizResult = null; return go('home');
        case 'templates': return go('templates');
        case 'wizard': wiz = null; wizResult = null; return go('wizard');
        case 'library': return go('library');
        case 'new': draft = { id: App.uid(), name: t('tr.defaultName'), createdAt: Date.now(), source: 'custom', days: [{ id: App.uid(), name: 'Day 1', exercises: [] }] }; draftIsNew = true; return go('editor');
        case 'tplopen': tplOpen = tplOpen === id ? null : id; return rerender();
        case 'usetpl': { const tpl = Lib.TEMPLATES.find((x) => x.id === id); const p = programFromTemplate(tpl); await saveProgram(p, true); App.toast(t('tr.ed.saved')); pickDay = null; return go('home'); }
        case 'wizgo': {
          const g = (i) => root.querySelector('#' + i).value;
          wiz = { goal: g('wgoal'), experience: g('wexp'), days: Number(g('wdays')), duration: Math.max(20, Math.min(180, Number(g('wdur')) || 60)) };
          wizResult = suggest(wiz); return rerender();
        }
        case 'wizsave': await saveProgram(wizResult.program, true); wizResult = null; pickDay = null; App.toast(t('tr.ed.saved')); return go('home');
        case 'wizedit': draft = wizResult.program; draftIsNew = true; wizResult = null; return go('editor');
        case 'pickday': pickDay = Number(b.dataset.i); return rerender();
        case 'start': { const p = (await programs()).find((x) => x.id === App.state.activeProgramId); if (p) App.workout.start(p, pickDay || 0); return; }
        case 'resume': App.workout.resume(); return;
        case 'activate': App.state.activeProgramId = id; App.save(); pickDay = null; return rerender();
        case 'edit': draft = App.clone(await DB.get('programs', id)); draftIsNew = false; return go('editor');
        case 'dup': { const p = App.clone(await DB.get('programs', id)); p.id = App.uid(); p.name = p.name + ' (2)'; p.createdAt = Date.now(); p.days.forEach((d) => { d.id = App.uid(); }); await DB.put('programs', p); return rerender(); }
        case 'del': {
          if (!(await App.confirm(t('tr.delAsk'), t('tr.del')))) return;
          await DB.del('programs', id);
          if (App.state.activeProgramId === id) { const rest = await programs(); App.state.activeProgramId = rest.length ? rest[0].id : null; App.save(); }
          pickDay = null; return rerender();
        }
        // editor
        case 'addday': draft.days.push({ id: App.uid(), name: 'Day ' + (draft.days.length + 1), exercises: [] }); return rerender();
        case 'delday': draft.days.splice(di, 1); return rerender();
        case 'dupday': { const c = App.clone(draft.days[di]); c.id = App.uid(); c.name += ' (2)'; draft.days.splice(di + 1, 0, c); return rerender(); }
        case 'dayup': if (di > 0) { [draft.days[di - 1], draft.days[di]] = [draft.days[di], draft.days[di - 1]]; } return rerender();
        case 'daydown': if (di < draft.days.length - 1) { [draft.days[di + 1], draft.days[di]] = [draft.days[di], draft.days[di + 1]]; } return rerender();
        case 'addex': return openPicker((picked) => { draft.days[di].exercises.push(newEntry(picked)); rerender(); });
        case 'exdel': draft.days[di].exercises.splice(ei, 1); return rerender();
        case 'exup': { const a = draft.days[di].exercises; if (ei > 0) [a[ei - 1], a[ei]] = [a[ei], a[ei - 1]]; return rerender(); }
        case 'exdown': { const a = draft.days[di].exercises; if (ei < a.length - 1) [a[ei + 1], a[ei]] = [a[ei], a[ei + 1]]; return rerender(); }
        case 'exedit': return openExEdit(di, ei, rerender);
        case 'edsave': {
          if (!draft.name) { App.toast(t('tr.ed.errName')); return; }
          if (!draft.days.length) { App.toast(t('tr.ed.errDays')); return; }
          if (draft.days.some((d) => !d.exercises.length)) { App.toast(t('tr.ed.errEx')); return; }
          draft.days.forEach((d, i) => { if (!d.name) d.name = 'Day ' + (i + 1); });
          b.disabled = true;
          await saveProgram(draft, true);
          App.toast(t('tr.ed.saved')); draft = null; pickDay = null; return go('home');
        }
        // library
        case 'libgroup': libState.g = b.dataset.g; return rerender();
        case 'imgadd': return App.exImg.pick(id, () => rerender());
        case 'imgdel': await App.exImg.del(id); return rerender();
        case 'newex': return openCustomForm(() => rerender());
        case 'delcx': {
          if (!(await App.confirm(t('tr.cx.delAsk'), t('tr.del')))) return;
          await DB.del('customExercises', id); return rerender();
        }
        default:
      }
    };

    // tapping a template-open row must work even though it's a div
    await show();
  });
})();

</script>

    },
  });

  /* ---------- calculations shared with the progress charts ---------- */
  const calc = {
    // Epley estimate, only for 1-12 reps (less reliable beyond that)
    e1rm(kg, reps) {
      kg = Number(kg); reps = Number(reps);
      if (!(kg > 0) || !(reps >= 1) || reps > 12) return null;
      return Math.round(kg * (1 + reps / 30) * 10) / 10;
    },
    metrics(sets) {
      const m = { e1rm: null, maxKg: null, volume: 0, maxReps: 0, topSet: null };
      (sets || []).forEach((s) => {
        const kg = Number(s.kg) || 0; const reps = Number(s.reps) || 0;
        if (reps <= 0) return;
        if (kg > 0) m.volume += kg * reps;
        if (reps > m.maxReps) m.maxReps = reps;
        if (kg > 0 && (m.maxKg === null || kg > m.maxKg)) m.maxKg = kg;
        const e = calc.e1rm(kg, reps);
        if (e !== null && (m.e1rm === null || e > m.e1rm)) { m.e1rm = e; m.topSet = { kg, reps }; }
      });
      m.volume = Math.round(m.volume * 10) / 10;
      return m;
    },
    // the one number used to compare two sessions of the same exercise
    primary(m, unit) {
      if (unit && unit !== 'reps') return { type: 'best', value: m.maxReps };
      if (m.e1rm !== null) return { type: 'e1rm', value: m.e1rm };
      if (m.volume > 0) return { type: 'volume', value: m.volume };
      return { type: 'reps', value: m.maxReps };
    },
  };
  App.calc = calc;

  /* ---------- session state ---------- */
  let S = null;
  let tick = null;
  let wake = null;
  let audio = null;

  const prefs = () => { const s = App.state; if (!s.wprefs) { s.wprefs = { sound: true, vibrate: true }; } return s.wprefs; };
  const persist = () => (S ? DB.put('misc', S) : Promise.resolve());
  const fmtClock = (sec) => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + App.pad(m) : App.pad(m)) + ':' + App.pad(s); };
  const fmtDur = (sec) => { const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return (h ? h + ' ' + t('w.hours') + ' ' : '') + m + ' ' + t('w.min'); };

  async function history() {
    return (await DB.all('workouts')).sort((a, b) => b.startTs - a.startTs);
  }
  function lastPerf(hist, exId) {
    for (const w of hist) { const e = (w.exercises || []).find((x) => x.exId === exId && x.sets && x.sets.length); if (e) return e; }
    return null;
  }

  async function start(program, dayIndex) {
    const day = program.days[dayIndex] || program.days[0];
    const { byId } = await App.ex.load();
    const hist = await history();
    S = {
      id: 'activeWorkout', programId: program.id, programName: program.name, dayIndex, dayName: day.name, startTs: Date.now(), cur: 0, rest: null,
      exercises: day.exercises.map((e) => {
        const lib = byId[e.exId]; const unit = lib ? lib.unit : 'reps';
        const prev = lastPerf(hist, e.exId);
        const sets = [];
        for (let i = 0; i < (e.sets || 1); i++) {
          const p = prev ? (prev.sets[i] || prev.sets[prev.sets.length - 1]) : null;
          sets.push({ kg: p ? p.kg : (e.kg === '' ? '' : e.kg), reps: p ? p.reps : e.reps, done: false });
        }
        return { exId: e.exId, nm: e.nm, unit, restSec: e.rest || 0, targetSets: e.sets, targetReps: e.reps, targetKg: e.kg, note: e.note || '', sets, skipped: false };
      }),
    };
    await persist();
    location.hash = '#/workout';
    App.render();
  }

  async function resume() {
    S = (await DB.get('misc', 'activeWorkout')) || null;
    if (!S) { App.toast(t('w.noSession')); return; }
    location.hash = '#/workout';
    App.render();
  }

  /* ---------- sound / vibration / wake lock ---------- */
  function beep() {
    if (!prefs().sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      [0, 0.25, 0.5].forEach((d) => {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        const t0 = audio.currentTime + d; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);

    } catch (e) { /* sound not supported: ignore */ }
  }
  const buzz = () => { if (prefs().vibrate && navigator.vibrate) navigator.vibrate([200, 100, 200]); };
  async function lockScreen() {

  }
  function unlockScreen() { try { if (wake) wake.release(); } catch (e) { /* ignore */ } wake = null; }

  /* ---------- rest timer ---------- */
  function startRest(sec) {
    if (!sec) return;
    S.rest = { total: sec, endTs: Date.now() + sec * 1000, paused: false, left: sec * 1000, fired: false };
    persist(); paintRest();
  }
  const restLeft = () => { const r = S.rest; if (!r) return 0; return r.paused ? r.left : Math.max(0, r.endTs - Date.now()); };

  function doTick(app) {
    if (!S) return;
    const clock = app.querySelector('#wclock'); if (clock) clock.textContent = fmtClock((Date.now() - S.startTs) / 1000);
    const r = S.rest; if (!r) return;
    const left = restLeft();
    const rt = app.querySelector('#rtime'); if (rt) rt.textContent = left > 0 ? fmtClock(Math.ceil(left / 1000)) : t('w.restDone');
    const rf = app.querySelector('#rfill'); if (rf) rf.style.width = Math.min(100, Math.round((1 - left / (r.total * 1000)) * 100)) + '%';
    if (left <= 0 && !r.fired && !r.paused) { r.fired = true; persist(); beep(); buzz(); }
  }

  /* ---------- rendering ---------- */
  function paintRest() {
    const host = document.getElementById('restHost'); if (!host) return;
    if (!S.rest) { host.innerHTML = ''; return; }
    host.innerHTML = '<div class="restbar"><div class="row"><b id="rtime">--:--</b><div class="bar grow"><i id="rfill"></i></div></div><div class="chips">' +
      '<button class="chip" data-w="rminus">−15</button><button class="chip" data-w="rplus">+15</button>' +
      '<button class="chip" data-w="rpause">' + esc(S.rest.paused ? t('w.resume') : t('w.pause')) + '</button>' +
      '<button class="chip" data-w="rreset">' + esc(t('w.reset')) + '</button><button class="chip" data-w="rskip">' + esc(t('w.skipRest')) + '</button></div></div>';
    doTick(document.getElementById('app'));
  }

  function paint(app, byId) {
    const n = S.exercises.length; const e = S.exercises[S.cur]; const lib = byId[e.exId];
    const showKg = e.unit === 'reps';
    const unitLbl = App.ex.unit(e.unit);
    const nextEx = S.exercises[S.cur + 1];
    const doneSets = e.sets.filter((s) => s.done).length;
    const prevLine = e.prev && e.prev.length ? e.prev.map((s) => (showKg && Number(s.kg) ? s.kg + t('w.kg') + ' × ' : '') + s.reps).join(' · ') : null;
    app.innerHTML = '<div class="wk"><header class="wk-top"><button class="icon-btn" data-w="exit" aria-label="' + esc(t('w.exit')) + '">✕</button>' +
      '<div class="grow" style="text-align:center"><div class="big" id="wclock">00:00</div><div class="muted small">' + esc(t('w.exercise', { i: S.cur + 1, n })) + '</div></div>' +
      '<button class="btn primary" data-w="finish">' + esc(t('w.finish')) + '</button></header>' +
      '<div class="wk-dots">' + S.exercises.map((x, i) => '<button data-w="goto" data-i="' + i + '" class="' + (i === S.cur ? 'on' : x.sets.some((s) => s.done) ? 'ok' : '') + '" aria-label="' + (i + 1) + '"></button>').join('') + '</div>' +
      '<main class="wk-main"><div class="card stack">' + (App.exImg.get(e.exId) ? '<img class="exhero" src="' + App.exImg.get(e.exId) + '" alt="">' : '') + '<div class="row"><div class="grow"><h2 style="margin:0">' + esc(App.ex.name(lib, true) === '?' ? e.nm : App.ex.name(lib, true)) + '</h2>' +
      '<p class="muted small">' + esc(lib ? App.ex.group(lib.g) : '') + ' · ' + esc(t('w.target')) + ': ' + esc(e.targetSets + ' × ' + e.targetReps + ' ' + unitLbl + (e.targetKg ? ' · ' + e.targetKg + ' ' + t('w.kg') : '') + ' · ' + t('w.rest') + ' ' + e.restSec + t('w.sec')) + '</p>' +
      (e.note ? '<p class="small">📝 ' + esc(e.note) + '</p>' : '') + '</div>' + (e.skipped ? '<span class="badge">' + esc(t('w.skipped')) + '</span>' : '') + '</div>' +
      '<p class="small muted">' + esc(t('w.prev')) + ': ' + (prevLine ? esc(prevLine) : esc(t('w.noPrev'))) + '</p>' +
      (e.skipped ? '<button class="btn block" data-w="unskip">' + esc(t('w.unskip')) + '</button>' :
        '<div class="setrow head"><span>' + esc(t('w.set')) + '</span>' + (showKg ? '<span>' + esc(t('w.kg')) + '</span>' : '<span></span>') + '<span>' + esc(unitLbl) + '</span><span>✓</span></div>' +
        e.sets.map((s, i) => '<div class="setrow' + (s.done ? ' done' : '') + '"><span class="n">' + (i + 1) + '</span>' +
          (showKg ? '<input type="number" inputmode="decimal" min="0" step="0.5" data-f="kg" data-s="' + i + '" value="' + esc(s.kg) + '" aria-label="' + esc(t('w.kg')) + '">' : '<span></span>') +
          '<input type="number" inputmode="numeric" min="0" step="1" data-f="reps" data-s="' + i + '" value="' + esc(s.reps) + '" aria-label="' + esc(unitLbl) + '">' +
          '<button class="tick" data-w="toggle" data-s="' + i + '" aria-pressed="' + s.done + '" aria-label="' + esc(t('w.set') + ' ' + (i + 1)) + '">' + (s.done ? '✓' : '○') + '</button></div>').join('') +
        '<div class="chips"><button class="chip" data-w="addset">＋ ' + esc(t('w.addSet')) + '</button>' + (e.sets.length > 1 ? '<button class="chip" data-w="rmset">− ' + esc(t('w.removeSet')) + '</button>' : '') +
        (e.restSec ? '<button class="chip" data-w="startrest">⏱ ' + esc(t('w.startRest', { s: e.restSec })) + '</button>' : '') +
        '<button class="chip" data-w="skip">' + esc(t('w.skip')) + '</button></div>') +
      '<p class="muted small">' + doneSets + '/' + e.sets.length + '</p></div>' +
      '<div class="card row"><button class="btn" data-w="prev"' + (S.cur === 0 ? ' disabled' : '') + '>' + (App.state.lang === 'fr' || App.state.lang === 'en' ? '←' : '→') + '</button>' +
      '<p class="grow small" style="text-align:center">' + esc(nextEx ? t('w.next', { name: App.ex.name(byId[nextEx.exId], false) === '?' ? nextEx.nm : App.ex.name(byId[nextEx.exId], false) }) : t('w.last')) + '</p>' +
      '<button class="btn primary" data-w="next"' + (!nextEx ? ' disabled' : '') + '>' + (App.state.lang === 'fr' || App.state.lang === 'en' ? '→' : '←') + '</button></div>' +
      '<div class="card row small"><label class="switch-row grow"><span>🔊 ' + esc(t('w.sound')) + '</span><input type="checkbox" data-pref="sound"' + (prefs().sound ? ' checked' : '') + '></label>' +
      '<label class="switch-row grow"><span>📳 ' + esc(t('w.vibrate')) + '</span><input type="checkbox" data-pref="vibrate"' + (prefs().vibrate ? ' checked' : '') + '></label></div>' +
      '<p class="muted small">' + esc(t('w.limit')) + '</p></main><div id="restHost"></div></div>';
    paintRest();
    doTick(app);
  }

  async function finish(app) {
    const doneAny = S.exercises.some((e) => e.sets.some((s) => s.done));
    if (!doneAny) {
      if (await App.confirm(t('w.nothing'), t('w.discard'))) { await discard(); }
      return;
    }
    if (!(await App.confirm(t('w.finishAsk'), t('w.finish')))) return;
    const endTs = Date.now();
    const hist = await history();
    const prs = []; let sets = 0; let volume = 0; let exDone = 0;
    const exercises = S.exercises.map((e) => {
      const done = e.sets.filter((s) => s.done && Number(s.reps) > 0).map((s) => ({ kg: Number(s.kg) || 0, reps: Number(s.reps) || 0 }));
      if (done.length) {
        exDone += 1; sets += done.length;
        const m = calc.metrics(done); volume += m.volume;
        const cur = calc.primary(m, e.unit);
        const past = hist.map((w) => (w.exercises || []).find((x) => x.exId === e.exId)).filter((x) => x && x.sets && x.sets.length);
        if (past.length) {
          const best = Math.max.apply(null, past.map((x) => { const p = calc.primary(calc.metrics(x.sets), x.unit || e.unit); return p.type === cur.type ? p.value : -1; }));
          if (best >= 0 && cur.value > best) prs.push(e.nm);
        }
      }
      return { exId: e.exId, nm: e.nm, unit: e.unit, sets: done, skipped: e.skipped };
    }).filter((e) => e.sets.length);
    const rec = { id: App.uid(), date: App.dateKey(new Date(S.startTs)), programId: S.programId, programName: S.programName, dayIndex: S.dayIndex, dayName: S.dayName, startTs: S.startTs, endTs, durationSec: Math.round((endTs - S.startTs) / 1000), exercises };
    await DB.put('workouts', rec);
    await DB.put('attendance', { id: 'att_' + rec.date, date: rec.date, status: 'done', workoutId: rec.id });
    const rules = App.state.xpRules || { workout: 50, pr: 10 };
    const gain = (rules.workout || 0) + Math.min(prs.length, 5) * (rules.pr || 0);
    await App.addXp(gain, 'workout');
    await DB.del('misc', 'activeWorkout');
    const nm = App.nick();
    stop(); S = null;
    const m = App.modal('<h2>' + esc(t('w.summary')) + '</h2><p>' + esc(t(prs.length ? 'w.winPr' : 'w.win', { name: nm })) + '</p>' +
      '<div class="grid2"><div class="card"><div class="muted small">' + esc(t('w.duration')) + '</div><div class="big">' + esc(fmtDur(rec.durationSec)) + '</div></div>' +
      '<div class="card"><div class="muted small">' + esc(t('w.doneEx')) + '</div><div class="big">' + exDone + '</div></div>' +
      '<div class="card"><div class="muted small">' + esc(t('w.setsDone')) + '</div><div class="big">' + sets + '</div></div>' +
      '<div class="card"><div class="muted small">' + esc(t('w.volume')) + '</div><div class="big">' + Math.round(volume) + ' <span class="small muted">' + esc(t('w.kg')) + '</span></div></div></div>' +
      (prs.length ? '<div class="notice"><b>' + esc(t('w.prs')) + '</b><br>' + prs.map(esc).join(' · ') + '</div>' : '') +
      '<p class="badge">' + esc(t('w.xp', { n: gain })) + '</p><button class="btn primary block" id="wdone">' + esc(t('w.close')) + '</button>');
    m.el.onclick = (ev) => { if (ev.target.closest('#wdone')) { m.close(); location.hash = '#/train'; App.render(); } };
  }

  async function discard() {
    await DB.del('misc', 'activeWorkout'); S = null; unlockScreen(); location.hash = '#/train'; App.render();
  }
  function stop() { if (tick) { clearInterval(tick); tick = null; } unlockScreen(); }

  async function view(app) {
    if (!S) S = (await DB.get('misc', 'activeWorkout')) || null;
    if (!S) { location.hash = '#/train'; App.render(); return; }
    const { byId } = await App.ex.load(); await App.exImg.load();
    // attach "previous performance" for display (not stored in the session)
    const hist = await history();
    S.exercises.forEach((e) => { const p = lastPerf(hist, e.exId); Object.defineProperty(e, 'prev', { value: p ? p.sets : null, enumerable: false, configurable: true, writable: true }); });
    paint(app, byId);
    lockScreen();
    if (tick) clearInterval(tick);
    tick = setInterval(() => { if (App.current() !== 'workout') { stop(); return; } doTick(app); }, 250);
    document.onvisibilitychange = () => { if (document.visibilityState === 'visible' && S) { lockScreen(); doTick(app); } };

    app.oninput = (e) => {
      const f = e.target.dataset && e.target.dataset.f; if (!f) return;
      const set = S.exercises[S.cur].sets[Number(e.target.dataset.s)];
      set[f] = e.target.value === '' ? '' : Number(e.target.value);
      persist();
    };
    app.onchange = (e) => {
      const p = e.target.dataset && e.target.dataset.pref; if (!p) return;
      prefs()[p] = e.target.checked; App.save();
    };
    app.onclick = async (ev) => {
      const b = ev.target.closest('[data-w]'); if (!b) return;
      const w = b.dataset.w; const cur = S.exercises[S.cur];
      switch (w) {
        case 'exit': stop(); await persist(); location.hash = '#/train'; App.render(); return;
        case 'finish': await finish(app); return;
        case 'goto': S.cur = Number(b.dataset.i); break;
        case 'prev': if (S.cur > 0) S.cur -= 1; break;
        case 'next': if (S.cur < S.exercises.length - 1) S.cur += 1; break;
        case 'toggle': {
          const s = cur.sets[Number(b.dataset.s)]; s.done = !s.done;
          if (s.done) {
            if (audio && audio.state === 'suspended') audio.resume();
            else if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* ignore */ } }
            const lastEx = S.exercises.every((x, i) => i === S.cur || x.skipped || x.sets.every((y) => y.done));
            const allDone = cur.sets.every((x) => x.done);
            // rest after every set, except after the very last set of the whole workout
            if (cur.restSec && !(allDone && lastEx)) startRest(cur.restSec);
          }
          break;
        }
        case 'addset': { const last = cur.sets[cur.sets.length - 1]; cur.sets.push({ kg: last ? last.kg : '', reps: last ? last.reps : cur.targetReps, done: false }); break; }
        case 'rmset': if (cur.sets.length > 1) cur.sets.pop(); break;
        case 'skip': cur.skipped = true; cur.sets.forEach((s) => { s.done = false; }); break;
        case 'unskip': cur.skipped = false; break;
        case 'startrest': startRest(cur.restSec); await persist(); return;
        case 'rpause': {
          const r = S.rest; if (!r) return;
          if (r.paused) { r.endTs = Date.now() + r.left; r.paused = false; } else { r.left = Math.max(0, r.endTs - Date.now()); r.paused = true; }
          await persist(); paintRest(); return;
        }
        case 'rplus': case 'rminus': {
          const r = S.rest; if (!r) return; const d = w === 'rplus' ? 15000 : -15000;
          if (r.paused) r.left = Math.max(0, r.left + d); else r.endTs = Math.max(Date.now(), r.endTs + d);
          r.total = Math.max(1, r.total + d / 1000); r.fired = false; await persist(); doTick(app); return;
        }
        case 'rreset': { const r = S.rest; if (!r) return; r.endTs = Date.now() + r.total * 1000; r.paused = false; r.fired = false; await persist(); paintRest(); return; }
        case 'rskip': S.rest = null; await persist(); paintRest(); return;
        default: return;
      }
      await persist();

    };

  function statusOf(k, ctx) {

    let ico = v.ico; const days = new Set(v.days);

      (v.auto ? '<p class="muted small">' + esc(hname(v)) + ' — ' + esc(t('hbt.auto')) + '</p>' :
        field(t('hbt.name'), '<input type="text" id="hn" maxlength="50" value="' + esc(v.name) + '">') +
        '<span class="muted small">' + esc(t('hbt.icon')) + '</span><div class="ic-pick" id="hic">' + ICONS.map((x) => '<button type="button" data-ic="' + x + '" aria-pressed="' + (x === ico) + '">' + x + '</button>').join('') + '</div>') +
      '<span class="muted small">' + esc(t('hbt.freq')) + '</span><div class="chips"><button type="button" class="chip" data-pre="all">' + esc(t('hbt.daily')) + '</button><button type="button" class="chip" data-pre="wd">' + esc(t('hbt.weekdays')) + '</button></div>' +
      '<div class="chips" id="hdays">' + ALLD.map((i) => '<button type="button" class="chip" data-hd="' + i + '" aria-pressed="' + days.has(i) + '">' + esc(dnm(i)) + '</button>').join('') + '</div>' +
      '<div class="row"><button class="btn grow" data-x="1">' + esc(t('common.cancel')) + '</button>' + (h ? '<button class="btn danger grow" data-del="1">' + esc(t('common.delete')) + '</button>' : '') + '<button class="btn primary grow" data-ok="1">' + esc(t('common.save')) + '</button></div></div>');
    const paint = () => { m.el.querySelectorAll('[data-hd]').forEach((b) => b.setAttribute('aria-pressed', String(days.has(Number(b.dataset.hd))))); m.el.querySelectorAll('[data-ic]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ic === ico))); };
    m.el.onclick = async (e) => {
      const hd = e.target.closest('[data-hd]'); if (hd) { const n = Number(hd.dataset.hd); if (days.has(n)) days.delete(n); else days.add(n); return paint(); }
      const pre = e.target.closest('[data-pre]'); if (pre) { days.clear(); (pre.dataset.pre === 'all' ? ALLD : [1, 2, 3, 4, 5]).forEach((n) => days.add(n)); return paint(); }
      const ic = e.target.closest('[data-ic]'); if (ic) { ico = ic.dataset.ic; return paint(); }
      if (e.target.closest('[data-x]')) return m.close();
      if (e.target.closest('[data-del]')) { if (await App.confirm(t('hbt.delQ'))) { await DB.del('misc', h.id); m.close(); done(); } return; }
      if (e.target.closest('[data-ok]')) {
        let name = v.name; if (!v.auto) { name = m.el.querySelector('#hn').value.trim(); if (!name) return App.toast(t('hbt.needName')); }
        if (!days.size) return App.toast(t('hbt.needDay'));
        await DB.put('misc', Object.assign({}, v, { id: h ? h.id : HP + App.uid(), name, ico: v.auto ? v.ico : ico, days: Array.from(days).sort() }));
        m.close(); done();
      }
    };
  }

  const TABS = { habits: habitsTab, water: waterTab, sleep: sleepTab, att: attTab, goals: goalsTab };
  let tab = 'habits';
  App.registerView('habits', async function (root) {
    if (App._habitsTab && TABS[App._habitsTab]) { tab = App._habitsTab; } App._habitsTab = null;
    root.innerHTML = '<div class="seg" role="tablist">' + Object.keys(TABS).map((k) => '<button class="chip" role="tab" data-tab="' + k + '" aria-pressed="' + (k === tab) + '">' + esc(t('hb.tab.' + k)) + '</button>').join('') + '</div><div id="htab" class="stack" style="margin-block-start:12px"></div>';
    root.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; App.render(); }; });
    await TABS[tab](root.querySelector('#htab'));
  });
  App.habits = { statusOf };
})();

  S('nu.left', 'يبقالك {n} كالوري', 'المتبقي {n} سعرة', 'Reste {n} kcal', '{n} kcal left'); S('nu.over', 'تعدّيت بـ {n} كالوري', 'تجاوزت بـ {n} سعرة', 'Dépassé de {n} kcal', '{n} kcal over');
  S('nu.p', 'بروتين', 'بروتين', 'Protéines', 'Protein'); S('nu.c', 'كارب', 'كربوهيدرات', 'Glucides', 'Carbs'); S('nu.f', 'دهون', 'دهون', 'Lipides', 'Fat'); S('nu.fi', 'ألياف', 'ألياف', 'Fibres', 'Fiber');
  S('nu.breakfast', 'فطور', 'الفطور', 'Petit-déjeuner', 'Breakfast'); S('nu.lunch', 'غداء', 'الغداء', 'Déjeuner', 'Lunch'); S('nu.dinner', 'عشاء', 'العشاء', 'Dîner', 'Dinner'); S('nu.snack', 'سناك', 'وجبة خفيفة', 'Collation', 'Snack');
  S('nu.add', 'زيد ماكلة', 'أضف طعامًا', 'Ajouter', 'Add food'); S('nu.empty', 'ما فماش حاجة.', 'لا شيء بعد.', 'Rien pour l\'instant.', 'Nothing yet.');
  S('nu.search', 'ابحث عن ماكلة...', 'ابحث عن طعام...', 'Chercher un aliment…', 'Search food…');
  S('nu.grp.all', 'الكل', 'الكل', 'Tout', 'All'); S('nu.grp.mine', 'متاعي', 'أطعمتي', 'Les miens', 'My foods'); S('nu.grp.saved', 'وجبات محفوظة', 'وجبات محفوظة', 'Repas enregistrés', 'Saved meals');
  S('nu.grp.tn', 'تونسي 🇹🇳', 'تونسي 🇹🇳', 'Tunisien 🇹🇳', 'Tunisian 🇹🇳'); S('nu.grp.prot', 'بروتين', 'بروتين', 'Protéines', 'Protein'); S('nu.grp.grain', 'نشويات', 'نشويات', 'Féculents', 'Grains & starches');
  S('nu.grp.leg', 'قطاني ومكسّرات', 'بقوليات ومكسرات', 'Légumineuses & noix', 'Legumes & nuts'); S('nu.grp.dairy', 'ألبان', 'ألبان', 'Laitiers', 'Dairy'); S('nu.grp.fruit', 'غلة', 'فواكه', 'Fruits', 'Fruit');
  S('nu.grp.veg', 'خضرة', 'خضار', 'Légumes', 'Vegetables'); S('nu.grp.fat', 'دهون وصلصات', 'دهون وصلصات', 'Matières grasses', 'Fats & sauces'); S('nu.grp.sweet', 'حلويات', 'حلويات', 'Sucré', 'Sweet');
  S('nu.grp.drink', 'مشروبات', 'مشروبات', 'Boissons', 'Drinks'); S('nu.grp.fast', 'أكل سريع', 'وجبات سريعة', 'Fast-food', 'Fast food');
  S('nu.per100', 'لكل 100 غ', 'لكل 100 غ', 'pour 100 g', 'per 100 g'); S('nu.qty', 'الكمية (غ أو مل)', 'الكمية (غ أو مل)', 'Quantité (g ou ml)', 'Amount (g or ml)'); S('nu.portion', 'حصة', 'حصة', 'portion', 'portion');
  S('nu.addTo', 'زيد لـ {meal}', 'أضف إلى {meal}', 'Ajouter à {meal}', 'Add to {meal}'); S('nu.custom', 'ماكلة جديدة متاعي', 'طعام جديد من عندي', 'Créer mon aliment', 'Create my food');
  S('nu.name', 'الاسم', 'الاسم', 'Nom', 'Name'); S('nu.valuesNote', 'القيم لكل 100 غ.', 'القيم لكل 100 غ.', 'Valeurs pour 100 g.', 'Values per 100 g.');
  S('nu.needName', 'اكتب الاسم والكالوري.', 'اكتب الاسم والسعرات.', 'Écris le nom et les kcal.', 'Enter a name and calories.');
  S('nu.saveMeal', 'احفظ الوجبة', 'احفظ الوجبة', 'Enregistrer ce repas', 'Save this meal'); S('nu.mealName', 'اسم الوجبة', 'اسم الوجبة', 'Nom du repas', 'Meal name');
  S('nu.saved', 'تسجّلت ✅', 'تم الحفظ ✅', 'Enregistré ✅', 'Saved ✅'); S('nu.estimate', 'القيم تقديرية وتتغيّر حسب التحضير والماركة. للأكلات التونسية الأرقام تقريبية برشا؛ الأحسن تعدّل الكمية أو تعمل ماكلة متاعك.', 'القيم تقديرية وتختلف حسب التحضير والعلامة التجارية. أرقام الأطباق التونسية تقريبية جدًا؛ عدّل الكمية أو أنشئ طعامك الخاص.', 'Valeurs estimatives, variables selon la préparation et la marque. Pour les plats tunisiens, ce sont des ordres de grandeur ; ajuste la quantité ou crée ton propre aliment.', 'Values are estimates and vary with preparation and brand. Tunisian dishes are rough figures; adjust the amount or create your own food.');
  S('nu.deleteQ', 'نفسخ هذا السطر؟', 'حذف هذا السطر؟', 'Supprimer cette ligne ?', 'Delete this entry?'); S('nu.logged', 'سجّلت ماكلة اليوم 🍽️ +{n} نقطة خبرة', 'سجّلت طعام اليوم 🍽️ +{n} نقطة خبرة', 'Repas du jour notés 🍽️ +{n} XP', 'Meals logged 🍽️ +{n} XP');
  S('nu.noResult', 'ما لقيتش. تنجم تزيدها كماكلة متاعك.', 'لا نتائج. يمكنك إضافتها كطعام خاص بك.', 'Aucun résultat. Tu peux l\'ajouter comme aliment perso.', 'No results. You can add it as your own food.');

  S('nu.cal', 'السعرات', 'السعرات', 'Calories', 'Calories'); S('nu.of', 'من {n} كالوري مسجّلة', 'من {n} سعرة', 'sur {n} kcal', 'of {n} kcal eaten');
  S('nu.leftS', 'باقي', 'متبقٍ', 'restant', 'left'); S('nu.overS', 'زيادة', 'زيادة', 'en trop', 'over'); S('nu.gLeft', 'باقي {n} غ', 'متبقٍ {n} غ', '{n} g restant', '{n} g left');
  S('nu.today', 'ماكلة اليوم', 'طعام اليوم', 'Repas du jour', 'Today\'s food'); S('nu.day', 'ماكلة النهار', 'طعام اليوم', 'Repas de ce jour', 'Food of the day'); S('nu.pickMeal', 'أي وجبة؟', 'أي وجبة؟', 'Quel repas ?', 'Which meal?');
  const MEALS = ['breakfast', 'lunch', 'dinner', 'snack'];
  const MEAL_ICO = { breakfast: '🥣', lunch: '🍲', dinner: '🍛', snack: '🍎' };
  const GROUPS = ['all', 'tn', 'prot', 'grain', 'leg', 'dairy', 'fruit', 'veg', 'fat', 'sweet', 'drink', 'fast', 'mine', 'saved'];
  let date = dateKey(), grp = 'all', query = '';
  const lang = () => (App.state.lang === 'tn' ? 'ar' : App.state.lang);
  const nameOf = (f) => (f.n && (f.n[lang()] || f.n.en || f.n.fr || f.n.ar)) || f.name || '';
  const field = (label, input) => '<label class="field"><span>' + esc(label) + '</span>' + input + '</label>';
  const r1 = (x) => Math.round(x * 10) / 10;
  const bar = (v, max, cls) => '<div class="bar ' + (cls || '') + '"><i style="width:' + Math.min(100, max ? Math.round((v / max) * 100) : 0) + '%"></i></div>';
  const sum = (a, k) => a.reduce((x, r) => x + (Number(r[k]) || 0), 0);
  const calc = (f, g) => ({ kcal: Math.round((f.k * g) / 100), p: r1((f.p * g) / 100), c: r1((f.c * g) / 100), f: r1((f.f * g) / 100), fiber: r1(((f.fi || 0) * g) / 100) });

  async function allFoods() { const mine = (await DB.all('foods')).map((f) => Object.assign({ mine: true }, f)); return mine.concat(window.Foods.LIST); }

  function guessMeal() { const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 16 ? 'lunch' : h < 19 ? 'snack' : 'dinner'; }
  async function view(root) {
    const T = App.state.targets, today = dateKey();
    const rows = (await DB.all('meals')).filter((r) => r.date === date).sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const tot = { kcal: sum(rows, 'kcal'), p: sum(rows, 'p'), c: sum(rows, 'c'), f: sum(rows, 'f'), fiber: sum(rows, 'fiber') };
    const left = T.kcal - tot.kcal, over = left < 0, loc = App.LANGS[App.state.lang].locale;
    // day strip
    const first = (date < addDays(today, -20)) ? date : addDays(today, -20), last = date > addDays(today, 1) ? date : addDays(today, 1);
    let strip = '';
    for (let k = first; k <= last; k = addDays(k, 1)) {
      strip += '<button class="wk-day' + (k === date ? ' sel' : '') + (k === today ? ' today' : '') + (k > today ? ' fut' : '') + '" data-pick="' + k + '"><span>' + esc(App.fmtDate(parseKey(k), { weekday: 'short' })) + '</span><b><bdi>' + parseKey(k).getDate() + '</bdi></b></button>';
    }
    // gauge (270 degree arc)
    const R = 42, C = 2 * Math.PI * R, arc = 0.75 * C, pct = T.kcal ? Math.min(1, tot.kcal / T.kcal) : 0;
    const gauge = '<div class="gauge' + (over ? ' over' : '') + '"><svg viewBox="0 0 100 100"><g transform="rotate(135 50 50)"><circle class="trk" cx="50" cy="50" r="' + R + '" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + arc.toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
      '<circle class="val" cx="50" cy="50" r="' + R + '" fill="none" stroke-width="9" stroke-dasharray="' + arc.toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' + (arc * (1 - pct)).toFixed(1) + '"/></g></svg>' +
      '<div class="mid"><bdi>' + Math.abs(Math.round(left)) + '</bdi><small>' + esc(t(over ? 'nu.overS' : 'nu.leftS')) + '</small></div></div>';
    const mac = (key, label, tg, col) => '<div class="mac" style="--mc:' + col + '"><span class="lbl">' + esc(t(label)) + '</span><span class="v"><bdi>' + Math.round(tot[key]) + '</bdi><span>/' + tg + esc(t('nu.g')) + '</span></span>' + bar(tot[key], tg) +
      '<span class="left"><bdi>' + esc(t('nu.gLeft', { n: Math.max(0, Math.round(tg - tot[key])) })) + '</bdi></span></div>';
    const timeOf = (r) => (r.ts ? new Date(r.ts).toLocaleTimeString(loc, { hour: '2-digit', minute: '2-digit' }) : '');
    const food = rows.map((r) => '<div class="fd"><div class="ic">' + (MEAL_ICO[r.meal] || '🍽️') + '</div><div class="grow" style="min-width:0"><div class="nm">' + esc((r.nm && (r.nm[lang()] || r.nm.en)) || r.name) + '</div>' +
      '<div class="tags"><span>P <bdi>' + Math.round(r.p) + '</bdi>' + esc(t('nu.g')) + '</span><span>C <bdi>' + Math.round(r.c) + '</bdi>' + esc(t('nu.g')) + '</span><span>F <bdi>' + Math.round(r.f) + '</bdi>' + esc(t('nu.g')) + '</span></div></div>' +
      '<div class="kc"><span class="time"><bdi>' + esc(timeOf(r)) + '</bdi> · ' + esc(t('nu.' + r.meal)) + '</span><b><bdi>' + Math.round(r.kcal) + '</bdi></b><small>' + esc(t('nu.kcal')) + '</small></div>' +
      '<button class="icon-btn" style="width:36px;height:36px;background:none" data-del="' + r.id + '" aria-label="' + esc(t('common.delete')) + '">✕</button></div>').join('');
    const savers = MEALS.filter((m) => rows.some((r) => r.meal === m)).map((m) => '<button class="chip" data-savemeal="' + m + '">' + esc(t('nu.saveMeal')) + ' · ' + esc(t('nu.' + m)) + '</button>').join('');
    root.innerHTML = '<div class="nu-head"><small>' + esc(App.fmtDate(parseKey(date))) + '</small><h1>' + esc(t('nu.title')) + '</h1></div>' +
      '<div class="wk-strip" id="wkstrip">' + strip + '</div>' +
      '<div class="card cal-card"><div><div class="lbl">' + esc(t('nu.cal')) + '</div><div class="num"><bdi>' + Math.round(tot.kcal) + '</bdi></div><div class="muted small"><bdi>' + esc(t('nu.of', { n: T.kcal })) + '</bdi></div></div>' + gauge + '</div>' +
      '<div class="mac3">' + mac('p', 'nu.p', T.protein, '#ef5b5b') + mac('c', 'nu.c', T.carb, '#f5a524') + mac('f', 'nu.f', T.fat, '#8b6cf0') + '</div>' +
      '<p class="muted small">' + esc(t('nu.fi')) + ': <bdi>' + Math.round(tot.fiber) + '</bdi> ' + esc(t('nu.g')) + '</p>' +
      '<div class="sec-h"><h3>' + esc(t(date === today ? 'nu.today' : 'nu.day')) + '</h3></div>' +
      '<div class="card">' + (rows.length ? food : '<p class="muted" style="padding:8px 0">' + esc(t('nu.empty')) + '</p>') + '</div>' +
      (savers ? '<div class="chips">' + savers + '</div>' : '') +
      '<p class="muted small">' + esc(t('nu.estimate')) + '</p>' + App.guidance.rotating() +
      '<button class="fab" data-fab="1" aria-label="' + esc(t('nu.add')) + '">＋</button>';
    if (App._openAdd) { App._openAdd = false; setTimeout(() => { const f = root.querySelector('[data-fab]'); if (f) f.click(); }, 0); }
    const sel = root.querySelector('.wk-day.sel'); if (sel) { const y = window.scrollY; sel.scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, y); }
    root.onclick = async (e) => {
      const pk = e.target.closest('[data-pick]'); if (pk) { date = pk.dataset.pick; return view(root); }
      if (e.target.closest('[data-fab]')) {
        const dm = guessMeal();
        const m = App.modal('<h2>' + esc(t('nu.pickMeal')) + '</h2><div class="stack">' + MEALS.map((x) => '<button class="btn' + (x === dm ? ' primary' : '') + ' block" data-m="' + x + '">' + (MEAL_ICO[x]) + ' ' + esc(t('nu.' + x)) + '</button>').join('') + '</div>');
        m.el.onclick = (ev) => { const b = ev.target.closest('[data-m]'); if (!b) return; m.close(); picker(b.dataset.m, () => view(root)); };
        return;
      }
      const del = e.target.closest('[data-del]'); if (del) { if (await App.confirm(t('nu.deleteQ'))) { await DB.del('meals', del.dataset.del); view(root); } return; }
      const sv = e.target.closest('[data-savemeal]'); if (sv) return saveMeal(rows.filter((r) => r.meal === sv.dataset.savemeal));
    };
  }

  async function log(meal, f, grams, again) {
    const v = calc(f, grams);
    await DB.put('meals', { date, meal, name: nameOf(f), nm: f.n || null, fid: f.id, grams, kcal: v.kcal, p: v.p, c: v.c, f: v.f, fiber: v.fiber, ts: Date.now() });
    const n = (await DB.all('meals')).filter((r) => r.date === date).length;
    if (date === dateKey() && n >= 3 && await App.awardOnce('nutrition:' + date, 'nutrition', App.xpRules().nutrition)) App.toast(t('nu.logged', { n: App.xpRules().nutrition }));
    again();
  }

  async function picker(meal, done) {
    const foods = await allFoods(), saved = await DB.all('savedMeals');
    const m = App.modal('<h2>' + esc(t('nu.addTo', { meal: t('nu.' + meal) })) + '</h2><input type="text" id="fq" placeholder="' + esc(t('nu.search')) + '" value="' + esc(query) + '">' +
      '<div class="seg" style="margin-block:8px">' + GROUPS.map((g) => '<button class="chip" data-grp="' + g + '" aria-pressed="' + (grp === g) + '">' + esc(t('nu.grp.' + g)) + '</button>').join('') + '</div>' +
      '<div id="flist" style="max-height:46vh;overflow:auto"></div><button class="btn block" data-newfood="1" style="margin-block-start:10px">＋ ' + esc(t('nu.custom')) + '</button>');
    const list = m.el.querySelector('#flist');
    const draw = () => {
      const q = query.trim().toLowerCase();
      if (grp === 'saved') {
        list.innerHTML = saved.length ? saved.map((s) => '<div class="food-item" data-saved="' + s.id + '"><div class="grow"><b>' + esc(s.name) + '</b><div class="muted small"><bdi>' + Math.round(sum(s.items, 'kcal')) + '</bdi> ' + esc(t('nu.kcal')) + ' · ' + s.items.length + '</div></div><button class="icon-btn" data-sdel="' + s.id + '">🗑️</button></div>').join('') : '<p class="muted">' + esc(t('nu.empty')) + '</p>';
        return;
      }
      const res = foods.filter((f) => (grp === 'all' || (grp === 'mine' ? f.mine : f.g === grp)) && (!q || [f.n && f.n.ar, f.n && f.n.fr, f.n && f.n.en, f.name].filter(Boolean).join(' ').toLowerCase().includes(q))).slice(0, 60);
      list.innerHTML = res.length ? res.map((f) => '<div class="food-item" data-food="' + esc(f.id) + '"><div class="grow"><div>' + esc(nameOf(f)) + '</div><div class="muted small"><bdi>' + f.k + '</bdi> ' + esc(t('nu.kcal')) + ' ' + esc(t('nu.per100')) + '</div></div><span class="badge">+</span></div>').join('') : '<p class="muted">' + esc(t('nu.noResult')) + '</p>';
    };
    draw();
    m.el.querySelector('#fq').oninput = (e) => { query = e.target.value; draw(); };
    m.el.onclick = async (e) => {
      const g = e.target.closest('[data-grp]'); if (g) { grp = g.dataset.grp; m.el.querySelectorAll('[data-grp]').forEach((b) => b.setAttribute('aria-pressed', String(b === g))); return draw(); }
      if (e.target.closest('[data-newfood]')) { m.close(); return newFood(meal, done); }
      const sd = e.target.closest('[data-sdel]'); if (sd) { e.stopPropagation(); if (await App.confirm(t('nu.deleteQ'))) { await DB.del('savedMeals', sd.dataset.sdel); m.close(); picker(meal, done); } return; }
      const sm = e.target.closest('[data-saved]'); if (sm) {
        const s = saved.find((x) => x.id === sm.dataset.saved);
        for (const it of s.items) await DB.put('meals', Object.assign({}, it, { id: undefined, date, meal, ts: Date.now() }));
        m.close(); return done();
      }
      const fd = e.target.closest('[data-food]'); if (fd) { const f = foods.find((x) => String(x.id) === fd.dataset.food); m.close(); qty(meal, f, done); }
    };
  }

  function qty(meal, f, done) {
    let g = f.pg || 100;
    const m = App.modal('<h2>' + esc(nameOf(f)) + '</h2><div class="muted small">' + esc(t('nu.per100')) + ': <bdi>' + f.k + '</bdi> ' + esc(t('nu.kcal')) + ' · P<bdi>' + f.p + '</bdi> C<bdi>' + f.c + '</bdi> F<bdi>' + f.f + '</bdi></div>' +
      field(t('nu.qty'), '<input type="number" id="qg" inputmode="decimal" min="1" max="3000" value="' + g + '">') +
      '<div class="chips" style="margin-block:8px">' + [...new Set([f.pg || 100, 50, 100, 200])].map((n) => '<button class="chip" data-g="' + n + '">' + (n === f.pg ? esc(t('nu.portion')) + ' ' : '') + n + '</button>').join('') + '</div>' +
      '<div class="card macro-row" id="qm"></div><div class="row"><button class="btn grow" data-x="1">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" data-ok="1">' + esc(t('common.add')) + '</button></div>');
    const inp = m.el.querySelector('#qg');
    const upd = () => { g = Number(inp.value) || 0; const v = calc(f, g); m.el.querySelector('#qm').innerHTML = [[v.kcal, 'nu.kcal'], [v.p, 'nu.p'], [v.c, 'nu.c'], [v.f, 'nu.f']].map((x) => '<div><b><bdi>' + x[0] + '</bdi></b>' + esc(t(x[1])) + '</div>').join(''); };
    upd(); inp.oninput = upd;
    m.el.onclick = async (e) => {
      const c = e.target.closest('[data-g]'); if (c) { inp.value = c.dataset.g; return upd(); }
      if (e.target.closest('[data-x]')) return m.close();
      if (e.target.closest('[data-ok]')) { if (!(g > 0)) return; m.close(); await log(meal, f, g, done); }
    };
  }

  function newFood(meal, done) {
    const m = App.modal('<h2>' + esc(t('nu.custom')) + '</h2><div class="stack">' + field(t('nu.name'), '<input type="text" id="nn" maxlength="60">') + '<p class="muted small">' + esc(t('nu.valuesNote')) + '</p>' +
      '<div class="grid2">' + [['nk', 'nu.kcal'], ['np', 'nu.p'], ['nc', 'nu.c'], ['nf', 'nu.f'], ['nfi', 'nu.fi']].map((x) => field(t(x[1]), '<input type="number" id="' + x[0] + '" inputmode="decimal" min="0" value="">')).join('') + '</div>' +
      '<div class="row"><button class="btn grow" data-x="1">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" data-ok="1">' + esc(t('common.save')) + '</button></div></div>');
    m.el.onclick = async (e) => {
      if (e.target.closest('[data-x]')) return m.close();
      if (e.target.closest('[data-ok]')) {
        const v = (id) => Number(m.el.querySelector('#' + id).value) || 0, name = m.el.querySelector('#nn').value.trim();
        if (!name || !v('nk')) return App.toast(t('nu.needName'));
        const f = await DB.put('foods', { n: { ar: name, fr: name, en: name }, g: 'mine', k: v('nk'), p: v('np'), c: v('nc'), f: v('nf'), fi: v('nfi'), pg: 100 });
        m.close(); qty(meal, Object.assign({ mine: true }, f), done);
      }
    };
  }

  function saveMeal(items) {
    const m = App.modal('<h2>' + esc(t('nu.saveMeal')) + '</h2>' + field(t('nu.mealName'), '<input type="text" id="mn" maxlength="50">') +
      '<div class="row"><button class="btn grow" data-x="1">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" data-ok="1">' + esc(t('common.save')) + '</button></div>');
    m.el.onclick = async (e) => {
      if (e.target.closest('[data-x]')) return m.close();
      if (e.target.closest('[data-ok]')) {
        const name = m.el.querySelector('#mn').value.trim(); if (!name) return;
        await DB.put('savedMeals', { name, items: items.map(({ name, nm, fid, grams, kcal, p, c, f, fiber }) => ({ name, nm, fid, grams, kcal, p, c, f, fiber })) });
        m.close(); App.toast(t('nu.saved'));
      }
    };
  }

  App.registerView('nutrition', async function (root) { date = dateKey(); await view(root); });
})();

    isna: { fajr: 15, isha: 15 }, makkah: { fajr: 18.5, ishaMin: 90 },

    tunis: ['Tunis', 36.8065, 10.1815], ariana: ['Ariana', 36.8665, 10.1647], benarous: ['Ben Arous', 36.7531, 10.2189], nabeul: ['Nabeul', 36.4561, 10.7376],

    mahdia: ['Mahdia', 35.5047, 11.0622], kairouan: ['Kairouan', 35.6781, 10.0963], kasserine: ['Kasserine', 35.1676, 8.8365], sidibouzid: ['Sidi Bouzid', 35.0382, 9.4849],
    sfax: ['Sfax', 34.7406, 10.7603], gafsa: ['Gafsa', 34.425, 8.7842], gabes: ['Gabès', 33.8815, 10.0982], medenine: ['Médenine', 33.3549, 10.5055],
    tozeur: ['Tozeur', 33.9197, 8.1335], kebili: ['Kébili', 33.7072, 8.9715], tataouine: ['Tataouine', 32.9297, 10.4518],
  };
  const ORDER = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'];

  // returns { fajr, sunrise, dhuhr, asr, maghrib, isha } as minutes after local midnight (floats) for the given Date
  function compute(date, lat, lon, tz, method, asrFactor) {
    const m = METHODS[method] || METHODS.tunisia;
    const jd = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12) / 86400000 + 2440587.5;

    const g = mod(357.529 + 0.98560028 * D, 360), q = mod(280.459 + 0.98564736 * D, 360);

        (conflicts[x.id] ? '<div class="small" style="color:var(--bad)">' + esc(t('pl.conflict', { x: [...new Set(conflicts[x.id])].join('، ') })) + '</div>' : '') + '</div><button class="icon-btn" data-tedit="' + x.id + '">✏️</button></div></div>' })))
      .concat(done.map((w) => ({ s: new Date(w.startTs).getHours() * 60 + new Date(w.startTs).getMinutes(), kind: 'workout', html: '<div class="slot"><b>✅ ' + esc(t('pl.done')) + '</b> · ' + esc(w.dayName || '') + '</div>' })))
      .sort((a, b) => a.s - b.s);
    const shown = items.filter((i) => filt === 'all' || (filt === 'workout' ? i.kind === 'workout' : i.kind === 'task'));
    const has = new Set(allT.map((x) => x.date).concat(allW.map((w) => w.date)));
    const base = parseKey(today), first = new Date(base.getFullYear(), base.getMonth() + calOff, 1), lead = (first.getDay() + 6) % 7, dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const lc = { tn: 'ar-TN', ar: 'ar', fr: 'fr', en: 'en' }[App.state.lang] || 'en';
    let cells = ''; for (let i = 0; i < 7; i++) cells += '<div class="cal-h">' + esc(new Date(2024, 0, 1 + i).toLocaleDateString(lc, { weekday: 'narrow' })) + '</div>';
    cells += '<div></div>'.repeat(lead);
    for (let d = 1; d <= dim; d++) { const k = first.getFullYear() + '-' + String(first.getMonth() + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0'); cells += '<button class="cal-d' + (k === today ? ' today' : '') + (k === date ? ' sel' : '') + (has.has(k) ? ' has' : '') + '" data-pick="' + k + '"><bdi>' + d + '</bdi></button>'; }
    const calHTML = '<div class="card"><div class="row"><button class="icon-btn" data-cm="-1" aria-label="prev">‹</button><b class="grow" style="text-align:center">' + esc(first.toLocaleDateString(lc, { month: 'long', year: 'numeric' })) + '</b><button class="icon-btn" data-cm="1" aria-label="next">›</button></div>' +
      '<div class="pills">' + ['all', 'workout', 'task'].map((f) => '<button data-filt="' + f + '" aria-pressed="' + (filt === f) + '">' + esc(t('pl.f.' + f)) + '</button>').join('') + '</div><div class="cal">' + cells + '</div></div>';
    host.innerHTML = calHTML +
      '<div class="row" style="margin-block-start:10px"><button class="icon-btn" data-d="-1" aria-label="prev">‹</button><b class="grow" style="text-align:center">' + esc(date === today ? t('hb.today') : App.fmtDate(parseKey(date))) + '</b><button class="icon-btn" data-d="1" aria-label="next">›</button></div>' +
      '<button class="btn primary block" id="tadd" style="margin-block-start:10px">＋ ' + esc(t('pl.addTask')) + '</button>' +
      '<div class="card stack" style="margin-block-start:10px">' + (shown.length ? shown.map((i) => i.html).join('') : '<p class="muted">' + esc(t('pl.nothing')) + '</p>') + '</div>' +
      '<div class="card stack"><h3>🏋️ ' + esc(t('pl.suggest')) + '</h3>' + (sug.length ? sug.map((x, i) => '<div class="row"><div class="slot free grow"><bdi>' + hhmm(x.s) + '–' + hhmm(x.e) + '</bdi></div><button class="chip" data-sug="' + i + '">' + esc(t('pl.addToPlan')) + '</button></div>').join('') : '<p class="muted small">' + esc(t('pl.suggestNone')) + '</p>') +
      '<p class="muted small">' + esc(t('pl.suggestNote')) + '</p>' +
      '<label class="switch-row"><span>' + esc(t('pl.showPrayer')) + '</span><input type="checkbox" id="tshowp"' + (showPrayer ? ' checked' : '') + '></label></div>' +
      '<div class="card stack"><h3>' + esc(t('pl.free')) + '</h3>' + (free.length ? free.map((f) => '<div class="slot free"><bdi>' + hhmm(f[0]) + '–' + hhmm(f[1]) + '</bdi> · <bdi>' + Math.floor((f[1] - f[0]) / 60) + '</bdi> ' + esc(t('pl.h')) + ' <bdi>' + ((f[1] - f[0]) % 60) + '</bdi> ' + esc(t('pl.min')) + '</div>').join('') : '<p class="muted">–</p>') + '</div>';
    host.insertAdjacentHTML('beforeend', '<div class="card stack" id="dsum2"><h3>📊 ' + esc(t('ds.title')) + '</h3><div id="dsum2b"></div></div>');
    App.daySummary(date, true).then((h) => { const el = host.querySelector('#dsum2b'); if (el) el.innerHTML = h; });
    const reload = () => dayTab(host);
    host.onclick = async (e) => {
      const cm = e.target.closest('[data-cm]'); if (cm) { calOff += Number(cm.dataset.cm); return reload(); }
      const pk = e.target.closest('[data-pick]'); if (pk) { date = pk.dataset.pick; return reload(); }
      const fl = e.target.closest('[data-filt]'); if (fl) { filt = fl.dataset.filt; return reload(); }
      const d = e.target.closest('[data-d]'); if (d) { date = addDays(date, Number(d.dataset.d)); calOff = 0; return reload(); }
      if (e.target.closest('#tadd')) return taskModal(null, reload);
      const ed = e.target.closest('[data-tedit]'); if (ed) return taskModal(tasks.find((x) => x.id === ed.dataset.tedit), reload);
      const sg = e.target.closest('[data-sug]'); if (sg) { const x = sug[Number(sg.dataset.sug)]; await DB.put('tasks', { title: t('pl.workoutTitle'), date, start: hhmm(x.s), dur: x.e - x.s, kind: 'workout', done: false }); return reload(); }
    };
    host.onchange = async (e) => {
      const cb = e.target.closest('[data-tdone]'); if (cb) { const x = tasks.find((q) => q.id === cb.dataset.tdone); x.done = cb.checked; await DB.put('tasks', x); return reload(); }
      if (e.target.id === 'tshowp') { ps.showInPlan = e.target.checked; await App.prayer.saveSettings(ps); reload(); }
    };
  }
  function taskModal(x, done) {
    const v = x || { title: '', date, start: '18:00', dur: 60, kind: 'personal', done: false }; let kind = v.kind;
    const m = App.modal('<h2>' + esc(t(x ? 'pl.edit' : 'pl.addTask')) + '</h2><div class="stack">' + field(t('pl.taskTitle'), '<input type="text" id="tt" maxlength="80" value="' + esc(v.title) + '">') +
      '<div class="grid2">' + field(t('pl.date'), '<input type="date" id="td" value="' + v.date + '">') + field(t('pl.start'), '<input type="time" id="ts" value="' + v.start + '">') + '</div>' +
      field(t('pl.dur'), '<input type="number" id="tdu" inputmode="numeric" min="5" max="720" value="' + v.dur + '">') +
      '<div class="chips">' + KINDS.map((k) => '<button class="chip" data-kind="' + k + '" aria-pressed="' + (kind === k) + '">' + esc(t('pl.kind.' + k)) + '</button>').join('') + '</div>' +
      '<div class="row"><button class="btn grow" data-x="1">' + esc(t('common.cancel')) + '</button>' + (x ? '<button class="btn danger grow" data-del="1">' + esc(t('common.delete')) + '</button>' : '') + '<button class="btn primary grow" data-ok="1">' + esc(t('common.save')) + '</button></div></div>');
    m.el.onclick = async (e) => {
      const k = e.target.closest('[data-kind]'); if (k) { kind = k.dataset.kind; m.el.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b === k))); return; }
      if (e.target.closest('[data-x]')) return m.close();
      if (e.target.closest('[data-del]')) { if (await App.confirm(t('pl.deleteQ'))) { await DB.del('tasks', x.id); m.close(); done(); } return; }
      if (e.target.closest('[data-ok]')) {
        const title = m.el.querySelector('#tt').value.trim(); if (!title) return App.toast(t('pl.needTitle'));
        await DB.put('tasks', Object.assign({}, v, { title, date: m.el.querySelector('#td').value || date, start: m.el.querySelector('#ts').value || '18:00', dur: Number(m.el.querySelector('#tdu').value) || 30, kind }));
        m.close(); done();
      }
    };
  }

  /* ---------- BAG ---------- */
  let listId = null;
  const DEFAULT_ITEMS = ['shoes', 'clothes', 'towel', 'bottle', 'headphones', 'lock', 'card', 'snack', 'straps', 'charger'];
  async function bagTab(host) {
    const today = dateKey();
    let lists = await DB.all('bagLists');
    if (!lists.length) { const l = await DB.put('bagLists', { name: 'Gym', items: DEFAULT_ITEMS.map((k, i) => ({ id: 'i' + i, text: t('bag.i.' + k), checked: false })), checkedDate: today }); lists = [l]; }
    let L = lists.find((x) => x.id === listId) || lists[0]; listId = L.id;
    if (L.checkedDate !== today) { L.items.forEach((i) => { i.checked = false; }); L.checkedDate = today; await DB.put('bagLists', L); }
    const ready = L.items.filter((i) => i.checked).length;
    host.innerHTML = '<div class="seg">' + lists.map((l) => '<button class="chip" data-list="' + l.id + '" aria-pressed="' + (l.id === L.id) + '">' + esc(l.name) + '</button>').join('') + '<button class="chip" data-newlist="1">＋ ' + esc(t('bag.new')) + '</button></div>' +
      '<div class="card stack bag-hero" style="margin-block-start:10px"><div class="card-head"><h3>🎒 ' + esc(L.name) + '</h3><span class="badge"><bdi>' + esc(t('bag.ready', { a: ready, b: L.items.length })) + '</bdi></span></div>' +
      '<div class="bar ' + (ready === L.items.length && ready ? 'good' : '') + '"><i style="width:' + (L.items.length ? Math.round((ready / L.items.length) * 100) : 0) + '%"></i></div>' + (ready === L.items.length && ready ? '<p>' + esc(t('bag.allReady')) + '</p>' : '') +
      L.items.map((i) => '<div class="bag-item' + (i.checked ? ' checked' : '') + '"><input type="checkbox" data-chk="' + i.id + '"' + (i.checked ? ' checked' : '') + '>' + (i.photo ? '<img src="' + i.photo + '" alt="">' : '') + '<span class="grow">' + esc(i.text) + '</span>' +
        '<label class="icon-btn" title="' + esc(t('bag.photo')) + '">📷<input type="file" accept="image/*" data-photo="' + i.id + '" hidden></label><button class="icon-btn" data-rm="' + i.id + '" aria-label="' + esc(t('common.delete')) + '">🗑️</button></div>').join('') +
      '<div class="row"><input type="text" id="bnew" class="grow" maxlength="60" placeholder="' + esc(t('bag.addItem')) + '"><button class="btn primary" id="badd">＋</button></div>' +
      '<div class="row wrap"><button class="chip" data-act="reset">' + esc(t('bag.reset')) + '</button><button class="chip" data-act="rename">' + esc(t('bag.rename')) + '</button><button class="chip" data-act="dup">' + esc(t('bag.dup')) + '</button><button class="chip" data-act="del">' + esc(t('bag.delList')) + '</button></div>' +
      '<p class="muted small">' + esc(t('bag.photoNote')) + '</p></div>';
    const save = async () => { await DB.put('bagLists', L); bagTab(host); };
    host.onclick = async (e) => {
      const li = e.target.closest('[data-list]'); if (li) { listId = li.dataset.list; return bagTab(host); }
      if (e.target.closest('[data-newlist]')) return nameModal('', async (name) => { const n = await DB.put('bagLists', { name, items: [], checkedDate: today }); listId = n.id; bagTab(host); });
      if (e.target.closest('#badd')) { const inp = host.querySelector('#bnew'); const v = inp.value.trim(); if (!v) return; L.items.push({ id: App.uid(), text: v, checked: false }); return save(); }
      const rm = e.target.closest('[data-rm]'); if (rm) { L.items = L.items.filter((i) => i.id !== rm.dataset.rm); return save(); }
      const a = e.target.closest('[data-act]'); if (!a) return;
      if (a.dataset.act === 'reset') { L.items.forEach((i) => { i.checked = false; }); return save(); }
      if (a.dataset.act === 'rename') return nameModal(L.name, async (name) => { L.name = name; await save(); });
      if (a.dataset.act === 'dup') { const n = await DB.put('bagLists', { name: L.name + ' 2', items: L.items.map((i) => Object.assign({}, i, { id: App.uid(), checked: false })), checkedDate: today }); listId = n.id; return bagTab(host); }
      if (a.dataset.act === 'del') { if (await App.confirm(t('bag.delQ'))) { await DB.del('bagLists', L.id); listId = null; bagTab(host); } }
    };
    host.onchange = async (e) => {
      const c = e.target.closest('[data-chk]'); if (c) { L.items.find((i) => i.id === c.dataset.chk).checked = c.checked; return save(); }
      const p = e.target.closest('[data-photo]'); if (p && p.files[0]) { const url = await shrink(p.files[0]); L.items.find((i) => i.id === p.dataset.photo).photo = url; save(); }
    };
    host.querySelector('#bnew').onkeydown = (e) => { if (e.key === 'Enter') host.querySelector('#badd').click(); };
  }
  function shrink(file) {
    return new Promise((resolve) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const s = 160 / Math.max(img.width, img.height, 1), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.72)); };
      img.onerror = () => resolve(null); img.src = url;
    });
  }
  function nameModal(v, cb) {
    const m = App.modal('<h2>' + esc(t('bag.name')) + '</h2><input type="text" id="nm" maxlength="40" value="' + esc(v) + '"><div class="row" style="margin-block-start:10px"><button class="btn grow" data-x="1">' + esc(t('common.cancel')) + '</button><button class="btn primary grow" data-ok="1">' + esc(t('common.save')) + '</button></div>');
    m.el.onclick = (e) => { if (e.target.closest('[data-x]')) return m.close(); if (e.target.closest('[data-ok]')) { const n = m.el.querySelector('#nm').value.trim(); if (n) { m.close(); cb(n); } } };
  }

  /* ---------- PRAYER ---------- */
  async function prayerTab(host) {
    const P = App.prayer, ps = await P.settings(), now = new Date(), today = dateKey();
    const rec = (await DB.get('misc', 'prayers:' + today)) || { id: 'prayers:' + today, done: {} };
    const tm = P.timesFor(now, ps), nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
    const nextOf = () => { const n = new Date(), nm = n.getHours() * 60 + n.getMinutes(); for (const k of ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha']) if (tm[k] > nm) return { k, at: tm[k] }; const tt = P.timesFor(new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), ps); return { k: 'fajr', at: tt.fajr + 1440 }; };
    const nx = nextOf();
    const leftTxt = (at) => { const mm = Math.max(0, Math.round(at - (new Date().getHours() * 60 + new Date().getMinutes()))); return Math.floor(mm / 60) + ' ' + t('pl.h') + ' ' + (mm % 60) + ' ' + t('pl.min'); };
    const cityOpts = Object.keys(P.CITIES).map((c) => '<option value="' + c + '"' + (ps.city === c ? ' selected' : '') + '>' + esc(P.CITIES[c][0]) + '</option>').join('') + '<option value="custom"' + (ps.city === 'custom' ? ' selected' : '') + '>' + esc(t('pr.custom')) + '</option>';
    host.innerHTML =
      '<div class="card stack"><div class="card-head"><h3>🕌 ' + esc(t('nav.plan')) + ' · ' + esc(t('pl.tab.prayer')) + '</h3><span class="badge">' + esc(ps.city === 'custom' ? t('pr.custom') : P.CITIES[ps.city][0]) + '</span></div>' +
      '<p class="big" id="nxt" style="font-size:1.05rem">' + esc(t('pr.next', { name: t('pr.' + nx.k), left: leftTxt(nx.at) })) + '</p>' +
      P.ORDER.map((k) => '<div class="prayer-row' + (k === nx.k ? ' next' : '') + '"><span class="grow">' + esc(t('pr.' + k)) + '</span><bdi>' + P.fmt(tm[k]) + '</bdi>' +
        (k !== 'sunrise' ? '<label class="small muted"><input type="checkbox" data-pdone="' + k + '"' + (rec.done[k] ? ' checked' : '') + '> ' + esc(t('pr.dayDone')) + '</label>' : '') + '</div>').join('') +
      '<p class="muted small">' + esc(t('pr.note')) + '</p></div>' +
      '<div class="card stack"><h3>💧 ' + esc(t('pr.wudu')) + '</h3><div class="row"><button class="btn grow" data-wudu="yes">' + esc(t('pr.yes')) + '</button><button class="btn grow" data-wudu="no">' + esc(t('pr.no')) + '</button></div><div id="wuduOut"></div></div>' +
      '<details class="card"><summary><b>' + esc(t('pr.settings')) + '</b></summary><div class="stack" style="margin-block-start:10px">' +
      field(t('pr.city'), '<select id="pcity">' + cityOpts + '</select>') +
      '<div class="grid2">' + field('Lat', '<input type="number" id="plat" step="0.0001" value="' + ps.lat + '">') + field('Lon', '<input type="number" id="plon" step="0.0001" value="' + ps.lon + '">') + '</div>' +
      '<button class="btn" id="ploc">📍 ' + esc(t('pr.locate')) + '</button>' +
      field(t('pr.method'), '<select id="pmeth">' + Object.keys(P.METHODS).map((m) => '<option value="' + m + '"' + (ps.method === m ? ' selected' : '') + '>' + esc(t('pr.m.' + m)) + '</option>').join('') + '</select>') +
      field(t('pr.asrCalc'), '<select id="pasr"><option value="1"' + (Number(ps.asr) === 1 ? ' selected' : '') + '>' + esc(t('pr.asr1')) + '</option><option value="2"' + (Number(ps.asr) === 2 ? ' selected' : '') + '>' + esc(t('pr.asr2')) + '</option></select>') +
      '<div class="muted small">' + esc(t('pr.adj')) + '</div><div class="grid2">' + P.ORDER.map((k) => field(t('pr.' + k), '<input type="number" data-adj="' + k + '" step="1" min="-30" max="30" value="' + (ps.adj[k] || 0) + '">')).join('') + '</div>' +
      '<button class="btn primary" id="psave">' + esc(t('pr.save')) + '</button><p class="muted small">' + esc(t('pr.reminderNote')) + '</p></div></details>';
    stopTick();
    tick = setInterval(() => { const el = document.getElementById('nxt'); if (!el) return stopTick(); const n = nextOf(); el.textContent = t('pr.next', { name: t('pr.' + n.k), left: leftTxt(n.at) }); }, 20000);
    const cityEl = host.querySelector('#pcity');
    cityEl.onchange = () => { const c = App.prayer.CITIES[cityEl.value]; if (c) { host.querySelector('#plat').value = c[1]; host.querySelector('#plon').value = c[2]; } };
    host.onchange = async (e) => { const c = e.target.closest('[data-pdone]'); if (c) { rec.done[c.dataset.pdone] = c.checked; await DB.put('misc', rec); } };
    host.onclick = async (e) => {
      const w = e.target.closest('[data-wudu]');
      if (w) { host.querySelector('#wuduOut').innerHTML = w.dataset.wudu === 'yes' ? '<p>' + esc(t('pr.wuduYes')) + '</p>' : '<p>' + esc(t('pr.wuduNo')) + '</p>' + App.guidance.html('wudu'); return; }
      if (e.target.closest('#ploc')) {
        if (!navigator.geolocation) return App.toast(t('pr.locateFail'));
        navigator.geolocation.getCurrentPosition((pos) => { host.querySelector('#plat').value = pos.coords.latitude.toFixed(4); host.querySelector('#plon').value = pos.coords.longitude.toFixed(4); cityEl.value = 'custom'; App.toast(t('pr.located')); }, () => App.toast(t('pr.locateFail')), { timeout: 10000 });
        return;
      }
      if (e.target.closest('#psave')) {
        const adj = {}; host.querySelectorAll('[data-adj]').forEach((i) => { adj[i.dataset.adj] = Number(i.value) || 0; });
        const n = Object.assign({}, ps, { city: cityEl.value, lat: Number(host.querySelector('#plat').value), lon: Number(host.querySelector('#plon').value), method: host.querySelector('#pmeth').value, asr: Number(host.querySelector('#pasr').value), adj });
        if (!isFinite(n.lat) || !isFinite(n.lon) || Math.abs(n.lat) > 66) return App.toast(t('pr.locateFail'));
        await App.prayer.saveSettings(n); App.toast(t('msg.saved')); prayerTab(host);
      }
    };
  }

  /* ---------- view ---------- */
  const TABS = { day: dayTab, bag: bagTab, prayer: prayerTab };
  App.registerView('plan', async function (root) {
    stopTick(); date = dateKey(); calOff = 0;
    root.innerHTML = '<div class="seg" role="tablist">' + Object.keys(TABS).map((k) => '<button class="chip" role="tab" data-tab="' + k + '" aria-pressed="' + (k === tab) + '">' + esc(t('pl.tab.' + k)) + '</button>').join('') + '</div><div id="ptab2" class="stack" style="margin-block-start:12px"></div>';
    root.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; App.render(); }; });
    await TABS[tab](root.querySelector('#ptab2'));
  });
  App.registerView('bag', async function (root) {
    stopTick(); tab = 'bag';
    root.innerHTML = '<div id="ptab2" class="stack"></div>';
    await bagTab(root.querySelector('#ptab2'));
  });
  window.addEventListener('hashchange', stopTick);
  App.plan = { freeSlots, suggest };
})();

</script>
<script>
/* Progress tab. Tab "Exercises": a history table and a chart for every exercise, built ONLY from saved workouts.
 * Other tabs (consistency, goals, XP) are registered by their own modules through App.progress.addTab(). */
(function () {
  'use strict';
  const { t, esc, addStrings, DB } = App;

  addStrings({
    tn: {
      'pg.tab.exercises': 'التمارين', 'pg.chooseEx': 'اختار التمرين',

    },
    fr: {
      'pg.tab.exercises': 'Exercices', 'pg.chooseEx': 'Choisis l\'exercice',
      'pg.r7': '7 jours', 'pg.r30': '30 jours', 'pg.r90': '3 mois', 'pg.r180': '6 mois', 'pg.r365': '12 mois', 'pg.rall': 'Tout l\'historique',

      'pg.cmp.title': 'Comparaison avec la séance précédente', 'pg.cmp.first': 'Il faut au moins deux séances pour comparer.', 'pg.cmp.last': 'Avant ({d}) : {v}', 'pg.cmp.now': 'Dernière séance ({d}) : {v}',
      'pg.improved': 'Amélioration', 'pg.declined': 'Baisse', 'pg.stable': 'Plutôt stable',
      'pg.d.e1rm': 'Force estimée (1RM) : {d} kg ({p} %)', 'pg.d.volume': 'Volume total : {d} kg ({p} %)', 'pg.d.best': 'Meilleur résultat : {d} ({p} %)', 'pg.d.reps': 'Meilleures répétitions : {d} ({p} %)',
      'pg.cmp.note': 'La comparaison dépend de l\'exercice et des conditions d\'enregistrement (repos, sommeil, technique…). Moins de répétitions avec une charge plus lourde n\'est pas forcément une baisse.',
