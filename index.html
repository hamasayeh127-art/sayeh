      'pg.pr.title': 'Records', 'pg.pr.e1rm': '1RM estimé max', 'pg.pr.weight': 'Charge la plus lourde', 'pg.pr.reps': 'Plus de répétitions sur une série', 'pg.pr.sessions': 'Nombre de séances', 'pg.pr.volume': 'Volume total',
      'pg.hist': 'Historique', 'pg.th.date': 'Date', 'pg.th.sets': 'Séries', 'pg.th.top': 'Meilleure série', 'pg.th.e1rm': '1RM', 'pg.th.vol': 'Volume',
      'pg.e1rmNote': 'Le 1RM est estimé avec la formule d\'Epley, uniquement pour les séries de 1 à 12 répétitions. C\'est une estimation, pas une mesure.', 'pg.points': 'points', 'pg.on': 'le',
    },
    en: {
      'pg.tab.exercises': 'Exercises', 'pg.chooseEx': 'Choose an exercise',
      'pg.r7': '7 days', 'pg.r30': '30 days', 'pg.r90': '3 months', 'pg.r180': '6 months', 'pg.r365': '12 months', 'pg.rall': 'All history',
      'pg.noData': 'No workout recorded yet. After your first session, your charts will show up here.', 'pg.noRange': 'No data for this exercise in the selected period.',
      'pg.weight': 'Top weight (kg)', 'pg.e1rm': 'Estimated 1RM (kg)', 'pg.bestReps': 'Best result in a set', 'pg.chartLabel': 'Chart: {name}',
      'pg.cmp.title': 'Latest session vs previous', 'pg.cmp.first': 'You need at least two sessions to compare.', 'pg.cmp.last': 'Before ({d}): {v}', 'pg.cmp.now': 'Latest ({d}): {v}',
      'pg.improved': 'Improved', 'pg.declined': 'Declined', 'pg.stable': 'About stable',
      'pg.d.e1rm': 'Estimated strength (1RM): {d} kg ({p}%)', 'pg.d.volume': 'Total volume: {d} kg ({p}%)', 'pg.d.best': 'Best result: {d} ({p}%)', 'pg.d.reps': 'Best reps: {d} ({p}%)',
      'pg.cmp.note': 'The comparison depends on the exercise and recording conditions (rest, sleep, technique…). Fewer reps with a heavier weight is not necessarily a decline.',
      'pg.cmp.mixed': 'Weight and reps moved in opposite directions, so estimated strength (1RM) is compared rather than reps alone.',
      'pg.pr.title': 'Personal records', 'pg.pr.e1rm': 'Highest estimated 1RM', 'pg.pr.weight': 'Heaviest weight', 'pg.pr.reps': 'Most reps in a set', 'pg.pr.sessions': 'Sessions', 'pg.pr.volume': 'Total volume',
      'pg.hist': 'History', 'pg.th.date': 'Date', 'pg.th.sets': 'Sets', 'pg.th.top': 'Top set', 'pg.th.e1rm': '1RM', 'pg.th.vol': 'Volume',
      'pg.e1rmNote': '1RM is estimated with the Epley formula, only for sets of 1 to 12 reps. It is an estimate, not a measurement.', 'pg.points': 'points', 'pg.on': 'on',
    },
  });

  const RANGES = [['7', 7], ['30', 30], ['90', 90], ['180', 180], ['365', 365], ['all', null]];
  const fmtN = (x) => String(Math.round(x * 10) / 10);
  const dShort = (key) => App.fmtDate(App.parseKey(key), { day: 'numeric', month: 'short' });
  const dFull = (key) => App.fmtDate(App.parseKey(key), { day: 'numeric', month: 'short', year: 'numeric' });

  const tabs = [];
  let tab = 'exercises';
  let selEx = null;
  let range = '90';

  /* ---------- data ---------- */
  function sessionsFor(workouts, exId) {
    return workouts.map((w) => {
      const e = (w.exercises || []).find((x) => x.exId === exId);
      if (!e || !e.sets || !e.sets.length) return null;
      const m = App.calc.metrics(e.sets);
      return { id: w.id, date: w.date, ts: w.startTs, sets: e.sets, unit: e.unit || 'reps', nm: e.nm, m, nSets: e.sets.length };
    }).filter(Boolean).sort((a, b) => a.ts - b.ts);
  }

  const topSet = (s) => {
    if (s.m.topSet) return s.m.topSet;
    const sorted = s.sets.slice().sort((a, b) => ((b.kg || 0) - (a.kg || 0)) || ((b.reps || 0) - (a.reps || 0)));
    return sorted[0];
  };
  const setText = (set, unit) => (unit === 'reps' && Number(set.kg) > 0 ? fmtN(set.kg) + ' kg × ' + set.reps : set.reps + ' ' + App.ex.unit(unit));

  /* ---------- chart (hand-made SVG, works offline) ---------- */
  function chart(sessions, unit, label) {
    const W = 340, H = 200, mL = 38, mR = 12, mT = 12, mB = 26;
    const weighted = unit === 'reps' && sessions.some((s) => s.m.maxKg !== null);
    const series = weighted
      ? [{ key: 'maxKg', name: t('pg.weight'), color: '#6aa9ff', shape: 'circle' }, { key: 'e1rm', name: t('pg.e1rm'), color: '#ff8a3d', shape: 'square' }]
      : [{ key: 'maxReps', name: unit === 'reps' ? t('pg.bestReps') + ' (' + App.ex.unit('reps') + ')' : t('pg.bestReps') + ' (' + App.ex.unit(unit) + ')', color: '#ff8a3d', shape: 'circle' }];
    const vals = [];
    sessions.forEach((s) => series.forEach((se) => { const v = s.m[se.key]; if (v != null) vals.push(v); }));
    if (!vals.length) return '';
    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi === lo) { hi += 1; lo = Math.max(0, lo - 1); }
    const pad = (hi - lo) * 0.1; lo = Math.max(0, lo - pad); hi += pad;
    const t0 = sessions[0].ts, t1 = sessions[sessions.length - 1].ts;
    const X = (ts) => (t1 === t0 ? (mL + (W - mL - mR) / 2) : mL + ((ts - t0) / (t1 - t0)) * (W - mL - mR));
    const Y = (v) => mT + (1 - (v - lo) / (hi - lo)) * (H - mT - mB);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = lo + ((hi - lo) * i) / 4; const y = Y(v);
      g += '<line class="grid" x1="' + mL + '" x2="' + (W - mR) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (mL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + fmtN(v) + '</text>';
    }
    g += '<text x="' + mL + '" y="' + (H - 6) + '" text-anchor="start">' + esc(dShort(sessions[0].date)) + '</text>';
    if (sessions.length > 1) g += '<text x="' + (W - mR) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(dShort(sessions[sessions.length - 1].date)) + '</text>';
    series.forEach((se) => {
      const pts = sessions.filter((s) => s.m[se.key] != null).map((s) => [X(s.ts), Y(s.m[se.key])]);
      if (pts.length > 1) g += '<polyline fill="none" stroke="' + se.color + '" stroke-width="2.5" stroke-linejoin="round" points="' + pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') + '"/>';
      pts.forEach((p) => {
        g += se.shape === 'square'
          ? '<rect x="' + (p[0] - 4) + '" y="' + (p[1] - 4) + '" width="8" height="8" fill="' + se.color + '"/>'
          : '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4.5" fill="' + se.color + '"/>';
      });
    });
    const legend = '<div class="legend">' + series.map((se) => '<span><i style="background:' + se.color + ';border-radius:' + (se.shape === 'circle' ? '50%' : '2px') + '"></i>' + esc(se.name) + '</span>').join('') + '</div>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label + ' — ' + sessions.length + ' ' + t('pg.points')) + '">' + g + '</svg>' + legend;
  }

  /* ---------- comparison: latest vs previous session ---------- */
  function compare(all, unit) {
    if (all.length < 2) return '<p class="muted">' + esc(t('pg.cmp.first')) + '</p>';
    const cur = all[all.length - 1], prev = all[all.length - 2];
    let type, a, b;
    if (unit !== 'reps') { type = 'best'; a = prev.m.maxReps; b = cur.m.maxReps; }
    else if (cur.m.e1rm !== null && prev.m.e1rm !== null) { type = 'e1rm'; a = prev.m.e1rm; b = cur.m.e1rm; }
    else if (cur.m.volume > 0 && prev.m.volume > 0) { type = 'volume'; a = prev.m.volume; b = cur.m.volume; }
    else { type = 'reps'; a = prev.m.maxReps; b = cur.m.maxReps; }
    const diff = b - a; const pct = a ? (diff / a) * 100 : 0;
    const status = pct >= 1.5 ? 'improved' : pct <= -1.5 ? 'declined' : 'stable';
    const cls = status === 'improved' ? 'good' : status === 'declined' ? 'bad' : 'neutral';
    const icon = status === 'improved' ? '▲' : status === 'declined' ? '▼' : '■';
    const sign = diff > 0 ? '+' : '';
    const dTxt = t('pg.d.' + type, { d: sign + fmtN(diff), p: sign + fmtN(pct) });
    const tp = topSet(prev), tc = topSet(cur);
    const mixed = unit === 'reps' && Number(tc.kg) !== Number(tp.kg) && ((Number(tc.kg) > Number(tp.kg)) !== (Number(tc.reps) > Number(tp.reps))) && Number(tc.reps) !== Number(tp.reps);
    return '<div class="stack"><div class="delta ' + cls + '"><span aria-hidden="true">' + icon + '</span><span>' + esc(t('pg.' + status)) + '</span></div>' +
      '<p>' + esc(t('pg.cmp.last', { d: dShort(prev.date), v: '\u2066' + setText(tp, unit) + '\u2069' })) + '<br>' + esc(t('pg.cmp.now', { d: dShort(cur.date), v: '\u2066' + setText(tc, unit) + '\u2069' })) + '</p>' +
      '<p class="small">' + esc(dTxt) + '</p>' + (mixed ? '<p class="small muted">' + esc(t('pg.cmp.mixed')) + '</p>' : '') +
      '<p class="small muted">' + esc(t('pg.cmp.note')) + '</p></div>';
  }

  /* ---------- tab: exercises ---------- */
  async function exercisesTab(root) {
    const workouts = await DB.all('workouts');
    const { byId } = await App.ex.load();
    const ids = []; const seen = {};
    workouts.slice().sort((a, b) => b.startTs - a.startTs).forEach((w) => (w.exercises || []).forEach((e) => { if (!seen[e.exId] && e.sets && e.sets.length) { seen[e.exId] = 1; ids.push(e); } }));
    if (!ids.length) { root.innerHTML = '<div class="card empty">' + esc(t('pg.noData')) + '</div>'; return; }
    if (!selEx || !seen[selEx]) selEx = ids[0].exId;
    const nameOf = (e) => (byId[e.exId] ? App.ex.name(byId[e.exId], true) : e.nm);
    const all = sessionsFor(workouts, selEx);
    const unit = all[all.length - 1].unit;
    const days = RANGES.find((r) => r[0] === range)[1];
    const cutoff = days ? App.addDays(App.dateKey(), -days) : null;
    const inRange = cutoff ? all.filter((s) => s.date >= cutoff) : all;
    const entry = ids.find((e) => e.exId === selEx);
    const title = nameOf(entry);

    // personal records over ALL recorded history
    const pr = { e1rm: null, kg: null, reps: 0, volume: 0 };
    all.forEach((s) => {
      if (s.m.e1rm !== null && (!pr.e1rm || s.m.e1rm > pr.e1rm.v)) pr.e1rm = { v: s.m.e1rm, d: s.date };
      if (s.m.maxKg !== null && (!pr.kg || s.m.maxKg > pr.kg.v)) { const set = s.sets.filter((x) => Number(x.kg) === s.m.maxKg).sort((a, b) => b.reps - a.reps)[0]; pr.kg = { v: s.m.maxKg, d: s.date, reps: set.reps }; }
      if (s.m.maxReps > pr.reps) pr.reps = s.m.maxReps;
      pr.volume += s.m.volume;
    });

    const prRow = (label, value) => '<div class="row small"><span class="grow muted">' + esc(label) + '</span><b>' + value + '</b></div>';
    root.innerHTML =
      '<label class="field"><span>' + esc(t('pg.chooseEx')) + '</span><select id="exsel">' + ids.map((e) => '<option value="' + esc(e.exId) + '"' + (e.exId === selEx ? ' selected' : '') + '>' + esc(nameOf(e)) + '</option>').join('') + '</select></label>' +
      '<div class="seg" role="group">' + RANGES.map((r) => '<button class="chip" data-range="' + r[0] + '" aria-pressed="' + (range === r[0]) + '">' + esc(t('pg.r' + r[0])) + '</button>').join('') + '</div>' +
      '<div class="card stack"><h3>' + esc(title) + '</h3>' + (inRange.length ? chart(inRange, unit, t('pg.chartLabel', { name: title })) : '<p class="muted">' + esc(t('pg.noRange')) + '</p>') + '</div>' +
      '<div class="card stack"><h3>' + esc(t('pg.cmp.title')) + '</h3>' + compare(all, unit) + '</div>' +
      '<div class="card stack"><h3>' + esc(t('pg.pr.title')) + '</h3>' +
      (pr.e1rm ? prRow(t('pg.pr.e1rm'), fmtN(pr.e1rm.v) + ' kg · ' + esc(dShort(pr.e1rm.d))) : '') +
      (pr.kg ? prRow(t('pg.pr.weight'), fmtN(pr.kg.v) + ' kg × ' + pr.kg.reps + ' · ' + esc(dShort(pr.kg.d))) : '') +
      prRow(t('pg.pr.reps'), pr.reps + ' ' + esc(App.ex.unit(unit))) + prRow(t('pg.pr.sessions'), String(all.length)) +
      (pr.volume ? prRow(t('pg.pr.volume'), Math.round(pr.volume) + ' kg') : '') +
      '<p class="small muted">' + esc(t('pg.e1rmNote')) + '</p></div>' +
      '<div class="card stack"><h3>' + esc(t('pg.hist')) + '</h3><div class="tablewrap"><table class="hist"><thead><tr><th>' + esc(t('pg.th.date')) + '</th><th>' + esc(t('pg.th.sets')) + '</th><th>' + esc(t('pg.th.top')) + '</th><th>' + esc(t('pg.th.e1rm')) + '</th><th>' + esc(t('pg.th.vol')) + '</th></tr></thead><tbody>' +
      all.slice().reverse().slice(0, 80).map((s) => '<tr><td>' + esc(dFull(s.date)) + '</td><td>' + s.nSets + ' · ' + esc(s.sets.map((x) => (unit === 'reps' && Number(x.kg) > 0 ? fmtN(x.kg) + '×' : '') + x.reps).join(', ')) + '</td><td><bdi>' + esc(setText(topSet(s), unit)) + '</bdi></td><td>' + (s.m.e1rm !== null ? fmtN(s.m.e1rm) : '—') + '</td><td>' + (s.m.volume ? Math.round(s.m.volume) : '—') + '</td></tr>').join('') +
      '</tbody></table></div></div>';

    root.querySelector('#exsel').onchange = (e) => { selEx = e.target.value; exercisesTab(root); };
    root.querySelectorAll('[data-range]').forEach((b) => { b.onclick = () => { range = b.dataset.range; exercisesTab(root); }; });
  }

  tabs.push({ id: 'exercises', label: 'pg.tab.exercises', render: exercisesTab });

  App.progress = {
    addTab(tabDef) { if (!tabs.find((x) => x.id === tabDef.id)) tabs.push(tabDef); },
  };

  App.registerView('progress', async function (root) {
    const order = tabs.slice();
    if (!order.find((x) => x.id === tab)) tab = order[0].id;
    root.innerHTML = '<div class="seg" role="tablist">' + order.map((x) => '<button class="chip" role="tab" data-tab="' + x.id + '" aria-pressed="' + (x.id === tab) + '">' + esc(t(x.label)) + '</button>').join('') + '</div><div id="ptab" class="stack"></div>';
    const host = root.querySelector('#ptab');
    root.querySelectorAll('[data-tab]').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; App.render(); }; });
    await order.find((x) => x.id === tab).render(host);
  });
})();

</script>
<script>
/* XP & levels tab (inside Progress): your level, recent XP, editable XP rules, achievements computed from your own data. */
(function () {
  'use strict';

  const r1 = (x) => Math.round(x * 10) / 10;
  const dShort = (k) => App.fmtDate(App.parseKey(k), { day: 'numeric', month: 'short' });
  async function rows() { return (await DB.all('misc')).filter((r) => r.id && r.id.indexOf(P) === 0 && r.kg).sort((a, b) => a.date.localeCompare(b.date)); }
  function chart(list) {
    const W = 340, H = 180, mL = 38, mR = 12, mT = 12, mB = 26;
    const vals = list.map((r) => r.kg); let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi === lo) { hi += 1; lo -= 1; } const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
    const t0 = App.parseKey(list[0].date).getTime(), t1 = App.parseKey(list[list.length - 1].date).getTime();
    const X = (d) => (t1 === t0 ? mL + (W - mL - mR) / 2 : mL + ((App.parseKey(d).getTime() - t0) / (t1 - t0)) * (W - mL - mR));
    const Y = (v) => mT + (1 - (v - lo) / (hi - lo)) * (H - mT - mB);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = lo + ((hi - lo) * i) / 4, y = Y(v); g += '<line class="grid" x1="' + mL + '" x2="' + (W - mR) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (mL - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + r1(v) + '</text>'; }
    g += '<text x="' + mL + '" y="' + (H - 6) + '" text-anchor="start">' + esc(dShort(list[0].date)) + '</text>';
    if (list.length > 1) g += '<text x="' + (W - mR) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(dShort(list[list.length - 1].date)) + '</text>';

  }

      '<button class="btn primary block" type="submit">' + esc(t('wt.add')) + '</button></form>' +

        '<div class="card stack"><h3>' + esc(t('wt.hist')) + '</h3>' + list.slice().reverse().slice(0, 60).map((r) => '<div class="row small"><span class="grow"><bdi>' + esc(dShort(r.date)) + '</bdi></span><b><bdi>' + r1(r.kg) + ' kg</bdi></b>' + (r.waist ? '<span class="muted"><bdi>' + r.waist + ' cm</bdi></span>' : '') + '<button class="icon-btn" style="width:36px;height:36px;background:none" data-wdel="' + r.id + '" aria-label="' + esc(t('common.delete')) + '">🗑️</button></div>').join('') + '</div>'
        : '<div class="card empty">' + esc(t('wt.none')) + '</div>');
    host.querySelector('#wtf').onsubmit = async (e) => {
      e.preventDefault();
      const kg = Number(host.querySelector('#wkg').value), date = host.querySelector('#wdate').value || today, waist = Number(host.querySelector('#wwaist').value) || null;

      if (N.tasks) tasks.forEach((x) => { if (due(now, mins(x.start) - 15, 10)) fire('task:' + x.id, t('nt.task'), x.title + ' · ' + x.start); });
      if (N.workout) {
        const ws = tasks.filter((x) => x.kind === 'workout');
        ws.forEach((x) => { if (due(now, mins(x.start) - 30, 10)) fire('wo:' + x.id, t('nt.workout'), x.start); });
        if (!ws.length && P.days.includes(dow) && due(now, 17 * 60, 10) && !(await DB.all('workouts')).some((w) => w.date === today)) fire('wo:day', t('nt.workout'), t('nt.workoutDay'));
      }
      if (N.words && now >= 11 * 60 && now < 22 * 60) fire('words', 'SAYEH SPORT PLUS', WORDS[Math.floor(Math.random() * WORDS.length)]);
      if (N.bag && P.days.includes((dow + 1) % 7) && due(now, 20 * 60, 10)) fire('bag', t('nt.bag'), t('nt.bagBody'));
      if (N.water && d.getHours() >= 10 && d.getHours() <= 20 && d.getHours() % 2 === 0 && now % 60 < 10) {
        const ml = (await DB.all('water')).filter((r) => r.date === today).reduce((a, r) => a + (Number(r.ml) || 0), 0);
        if (ml < App.state.targets.water * ((now / 60 - 8) / 12)) fire('water:' + d.getHours(), t('nt.water'), t('nt.waterBody'));
      }
      if (N.meals && (due(now, 14 * 60, 10) || due(now, 21 * 60, 10)) && !(await DB.all('meals')).some((r) => r.date === today)) fire('meals:' + (now < 17 * 60 ? 'a' : 'b'), t('nt.meals'), '');
      if (N.sleep && due(now, 9 * 60, 10) && !(await DB.all('sleep')).some((r) => r.date === today)) fire('sleep', t('nt.sleep'), '');
      if (N.goals && due(now, 18 * 60, 10) && (await DB.all('goals')).some((g) => g.status === 'active')) fire('goals', t('nt.goals'), '');
    } catch (e) { console.error(e); }
  }

  setInterval(check, 30000); setTimeout(check, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  App.notify = { check, settingsHTML, perm, WORDS };
})();

      }
    };

    g('file').onchange = async (e) => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      let data;
      try { data = JSON.parse(await file.text()); } catch (err) { data = null; }
      if (!data || data.app !== 'SAYEH SPORT PLUS' || !data.db || !data.state) { App.toast(t('s.importBad')); return; }
      if (!(await App.confirm(t('s.importAsk')))) return;
      await DB.restore(data.db); App.replaceState(data.state); App.applyLang(); App.toast(t('s.imported')); App.render();
    };

    root.onchange = (e) => { const n = e.target.closest('[data-notif]'); if (n) S.notif[n.dataset.notif] = n.checked; };

    g('form').onsubmit = (e) => {
      e.preventDefault();
      const val = (id) => g(id).value;
      const bad = (v, lo, hi) => v !== '' && !(Number(v) >= lo && Number(v) <= hi);
      const name = val('name').trim();
      if (!name) { App.toast(t('onb.err.name')); return; }
      if (bad(val('age'), 10, 100) || bad(val('height'), 100, 250) || bad(val('weight'), 30, 300)) { App.toast(t('onb.err.num')); return; }
      if (!days.size) { App.toast(t('onb.err.days')); return; }
      Object.assign(S.profile, {
        name, nicks: val('nicks').trim(), sex: val('sex'), age: val('age'), height: val('height'), weight: val('weight'), goal: val('goal'), experience: val('experience'),
        days: Array.from(days).sort(), duration: Number(val('duration')) || 60, workStart: val('workStart') || '08:00', workEnd: val('workEnd') || '17:00',
        sleepTarget: Number(val('sleepTarget')) || 8,
      });
      Object.assign(S.targets, {
        water: Number(val('water')) || 2500, kcal: Number(val('kcal')) || 2400, protein: Number(val('protein')) || 150, carb: Number(val('carb')) || 260, fat: Number(val('fat')) || 70,
      });
      if (App.save()) App.toast(t('msg.saved'));
    };
  });
})();

</script>
<script>
/* Start-up: apply language, ask the browser to keep our data, register the offline service worker, draw the first screen. */
(function () {
  'use strict';
  App.applyLang();

  // Ask the browser not to evict local data under storage pressure (it may still refuse).
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});

  // Service worker only works on HTTPS (or localhost), not when opening the file directly.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed', e); });
    });
  }

  App.render();
})();

</script>
